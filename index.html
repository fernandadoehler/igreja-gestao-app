<style>
  html, body, #root { height: 100%; margin: 0; }
  body { font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; background: #ffffff; }
  #boot-status {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 12px; background: #ffffff; font-family: ui-sans-serif, system-ui, sans-serif;
    color: #5a7d90; z-index: 9999;
  }
  #boot-error {
    display: none; position: fixed; inset: 0; background: #ffffff; z-index: 10000;
    padding: 32px; font-family: ui-monospace, monospace; color: #b91c1c; overflow: auto; white-space: pre-wrap;
  }
  .boot-spinner {
    width: 28px; height: 28px; border-radius: 999px; border: 3px solid #e3eff5; border-top-color: #04B9CD;
    animation: boot-spin 0.8s linear infinite;
  }
  @keyframes boot-spin { to { transform: rotate(360deg); } }
</style>

<div id="root"></div>
<div id="boot-status"><div class="boot-spinner"></div><div>Carregando IdeTech…</div></div>
<div id="boot-error"></div>

<script>
(function () {
  var statusEl = document.getElementById('boot-status');
  var errorEl = document.getElementById('boot-error');
  function showError(err) {
    if (statusEl) statusEl.style.display = 'none';
    errorEl.style.display = 'block';
    errorEl.textContent = 'Ocorreu um erro ao carregar o IdeTech:\n\n' + (err && err.stack ? err.stack : String(err));
    if (window.console && console.error) console.error(err);
  }
  window.addEventListener('error', function (e) { showError(e.error || e.message); });
  window.__ideTechShowBootError = showError;
})();
</script>
