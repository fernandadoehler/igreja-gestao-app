            <option value="">Todos</option>
            <option value="pending">Com pendências</option>
            <option value="ok">Completos</option>
          </select>
        </Field>
        <Field label="Campo">
          <select className={inp()} value={filters.fieldId} onChange={(e) => setFilters((f) => ({ ...f, fieldId: e.target.value, fieldValue: "" }))}>

            {boardFieldIds.map((id) => { const f = fieldById(id); return f ? <option key={String(id)} value={String(id)}>{f.name}</option> : null; })}
          </select>
        </Field>
        {field && (
          <Field label={`Valor de ${field.name}`} hint="Deixe vazio para filtrar apenas quem tem o campo preenchido.">
            {OPTION_TYPES.includes(field.type) ? (
              <select className={inp()} value={filters.fieldValue} onChange={(e) => setFilters((f) => ({ ...f, fieldValue: e.target.value }))}>
                <option value="">Qualquer valor preenchido</option>
                {(field.options || []).map((o) => <option key={o}>{o}</option>)}
              </select>
            ) : (
              <input className={inp()} value={filters.fieldValue} onChange={(e) => setFilters((f) => ({ ...f, fieldValue: e.target.value }))} placeholder="Contém..." />
            )}
          </Field>
        )}
      </div>
    </div>
  );
}

const emptyFilters = { q: "", assignees: [], labels: [], stages: [], due: "", status: "", fieldId: "", fieldValue: "" };

function getBoardMemberIds(board: any, allCards: any[]): string[] {
  const base = board.members || [];
  const fromCards = allCards.filter((c) => c.boardId === board.id).flatMap((c) => c.assignees);
  return Array.from(new Set([...base, ...fromCards]));
}

function InvitePeopleModal({ boardName, onClose, onSend }: any) {
  const [emails, setEmails] = useState(["", "", ""]);
  const setAt = (i: number, v: string) => setEmails((arr) => arr.map((x, xi) => (xi === i ? v : x)));
  const addField = () => setEmails((arr) => [...arr, ""]);
  const valid = emails.map((e) => e.trim()).filter((e) => /\S+@\S+\.\S+/.test(e));
  return (
    <Modal open onClose={onClose} width={520} zIndex={80} title="Convide pessoas"
      subtitle={`Insira os endereços de e-mail das pessoas que você deseja convidar para ${boardName}.`}
      footer={<><Btn onClick={onClose}>Cancelar</Btn><Btn variant="primary" disabled={valid.length === 0} onClick={() => onSend(valid)}>Enviar convite</Btn></>}>
      <div className="space-y-2.5">
        {emails.map((e, i) => (
          <input key={i} className={inp()} placeholder="email@empresa.com" value={e} onChange={(ev) => setAt(i, ev.target.value)} />
        ))}
      </div>
      <button onClick={addField} className="mt-2.5 flex items-center gap-1.5 text-sm font-medium text-[#04B9CD] hover:underline">
        <Plus size={14} /> Adicionar outro e-mail
      </button>
    </Modal>
  );
}

function BoardPeopleModal({ board, onClose }: any) {
  const { state, setState, toast } = useApp();
  const [inviteOpen, setInviteOpen] = useState(false);
  const [search, setSearch] = useState("");
  const memberIds = getBoardMemberIds(board, state.cards);
  const members = state.users.filter((u) => memberIds.includes(u.id) && u.name.toLowerCase().includes(search.toLowerCase()));

  const removeMember = (uid_: string) => {
    setState((s) => ({ ...s, boards: s.boards.map((b) => (b.id === board.id ? { ...b, members: getBoardMemberIds(b, s.cards).filter((id) => id !== uid_) } : b)) }));
  };

  const invite = (emails: string[]) => {
    const matched: string[] = [];
    let unmatched = 0;
    emails.forEach((email) => {
      const u = state.users.find((x) => x.email.toLowerCase() === email.toLowerCase());
      if (u) matched.push(u.id); else unmatched++;
    });
    if (matched.length) {
      setState((s) => ({ ...s, boards: s.boards.map((b) => (b.id === board.id ? { ...b, members: Array.from(new Set([...getBoardMemberIds(b, s.cards), ...matched])) } : b)) }));
    }
    if (matched.length && !unmatched) toast(`${matched.length} pessoa(s) adicionada(s) à trilha.`);
    else if (matched.length && unmatched) toast(`${matched.length} adicionada(s) · convite enviado para ${unmatched} e-mail(s).`);
    else toast(`Convite enviado para ${unmatched} e-mail(s).`);
    setInviteOpen(false);
  };

  return (
    <>
      <Modal open onClose={onClose} width={560} title="Pessoas" subtitle={board.name}>
        <div className="mb-3 flex items-center justify-between gap-3">
          <p className="text-sm text-muted-foreground">{memberIds.length} pessoa{memberIds.length !== 1 ? "s" : ""} nesta trilha</p>
          <Btn variant="primary" size="sm" icon={UserPlus} onClick={() => setInviteOpen(true)}>Convidar pessoas</Btn>
        </div>
        <div className="relative mb-3">
          <Search size={14} className="absolute left-2.5 top-2.5 text-muted-foreground" />
          <input className={cx(inp(), "pl-8")} placeholder="Pesquisar por nome" value={search} onChange={(e) => setSearch(e.target.value)} />
        </div>
        {members.length === 0 ? (
          <Empty icon={Users} title="Nenhuma pessoa encontrada">Convide alguém para participar desta trilha.</Empty>
        ) : (
          <div className="max-h-80 space-y-1.5 overflow-y-auto">
            {members.map((u) => (
              <div key={u.id} className="flex items-center gap-2.5 rounded-xl border border-border px-3 py-2.5">
                <Avatar user={u} size={30} />
                <div className="min-w-0 flex-1">
                  <p className="truncate text-sm font-medium text-foreground">{u.name}</p>
                  <p className="truncate text-xs text-muted-foreground">{u.email}</p>
                </div>
                <Btn variant="ghost" size="iconsm" onClick={() => removeMember(u.id)} title="Remover"><X size={14} /></Btn>
              </div>
            ))}
          </div>
        )}
      </Modal>
      {inviteOpen && <InvitePeopleModal boardName={board.name} onClose={() => setInviteOpen(false)} onSend={invite} />}
    </>
  );
}

  const setIcon = (k: string) => setState((s) => ({ ...s, boards: s.boards.map((b) => (b.id === board.id ? { ...b, icon: k } : b)) }));
  const setMinistry = (id: string) => setState((s) => ({ ...s, boards: s.boards.map((b) => (b.id === board.id ? { ...b, ministryId: id ? Number(id) : undefined, teamId: undefined } : b)) }));
  const setTeam = (id: string) => setState((s) => ({ ...s, boards: s.boards.map((b) => (b.id === board.id ? { ...b, teamId: id ? Number(id) : undefined } : b)) }));
  const selMinistry = MINISTRIES.find((m) => m.id === board.ministryId);
  return (
    <div ref={ref} className="absolute left-0 top-11 rounded-xl border border-border bg-card p-3 shadow-xl" style={{ zIndex: 50, width: 280 }} onClick={(e) => e.stopPropagation()}>
      <input autoFocus value={name} onChange={(e) => setName(e.target.value)}
        onBlur={commit} onKeyDown={(e) => { if (e.key === "Enter") { commit(); onClose(); } }}
        className={inp()} placeholder="Nome da trilha" />

      <div className="mt-3">
        <div className="mb-1.5 text-[10px] font-semibold uppercase tracking-wide text-muted-foreground">Cor</div>
        <div className="grid grid-cols-8 gap-1.5">
          {Object.entries(BOARD_TONES).map(([key, def]) => (
            <button key={key} onClick={() => setTone(key)} title={def.label}
              className={cx("h-6 w-6 rounded-full border-2 transition-transform hover:scale-110", def.dot, (board.tone || "slate") === key ? "border-foreground" : "border-transparent")} />
          ))}
        </div>
      </div>

      <div className="mt-3">
        <div className="mb-1.5 text-[10px] font-semibold uppercase tracking-wide text-muted-foreground">Ícone</div>
        <div className="grid grid-cols-6 gap-1.5">
          {BOARD_ICON_OPTIONS.map((o) => (
            <button key={o.key} onClick={() => setIcon(o.key)}
              className={cx("flex h-7 w-7 items-center justify-center rounded-lg border transition-colors", board.icon === o.key ? "border-[#04B9CD]/50 bg-[#04B9CD]/10 text-[#04B9CD]" : "border-border text-muted-foreground hover:bg-muted/50")}>
              <o.icon size={14} />
            </button>
          ))}

      </div>

      <div className="mt-3 border-t border-border pt-3">
        <div className="mb-1.5 text-[10px] font-semibold uppercase tracking-wide text-muted-foreground">Pertence a</div>
        <select className={cx(inp(), "mb-1.5")} value={board.ministryId ?? ""} onChange={(e) => setMinistry(e.target.value)}>
          <option value="">Nenhum ministério</option>
          {MINISTRIES.map((m) => <option key={m.id} value={m.id}>{m.emoji} {m.name}</option>)}
        </select>
        {selMinistry && (
          <select className={inp()} value={board.teamId ?? ""} onChange={(e) => setTeam(e.target.value)}>
            <option value="">Nenhuma equipe específica</option>

function BoardView({ board, onBack }: any) {
  const { state, setState, canAdmin, fieldById, openCard, requestMove, reorderCard, toast } = useApp();
  const [filters, setFilters] = useState(emptyFilters);
  const [showFilters, setShowFilters] = useState(false);
  const [drag, setDrag] = useState<any>(null);
  const [configStage, setConfigStage] = useState<any>(null);
  const [settings, setSettings] = useState(false);
  const [peopleOpen, setPeopleOpen] = useState(false);
  const [namePopoverOpen, setNamePopoverOpen] = useState(false);
  const [addStage, setAddStage] = useState(false);
  const [quickAddStageId, setQuickAddStageId] = useState<string | null>(null);
  const [stageName, setStageName] = useState("");

  const selMinistry = MINISTRIES.find((m) => m.id === board.ministryId);
  const selTeam = selMinistry?.teams.find((t) => t.id === board.teamId);

  const activeCount =
    filters.assignees.length + filters.labels.length + filters.stages.length +
    (filters.due ? 1 : 0) + (filters.status ? 1 : 0) + (filters.fieldId ? 1 : 0) + (filters.q ? 1 : 0);

  const matches = (c) => {
    if (filters.q) {
      const q = filters.q.toLowerCase();
      const inFields = Object.keys(c.values).some((fid) => displayValue(fieldById(fid), c.values[fid], state.users).toLowerCase().includes(q));
      if (!(c.title.toLowerCase().includes(q) || c.code.toLowerCase().includes(q) || c.description.toLowerCase().includes(q) || inFields)) return false;
    }
    if (filters.assignees.length && !c.assignees.some((a) => filters.assignees.includes(a))) return false;
    if (filters.labels.length && !c.labels.some((l) => filters.labels.includes(l))) return false;
    if (filters.due) {
      if (filters.due === "none" && c.due) return false;
      if (filters.due === "late" && !isLate(c.due)) return false;
      if (filters.due === "today" && c.due !== today()) return false;
      if (filters.due === "week" && !(c.due && c.due >= today() && c.due <= inDays(7))) return false;
    }
    if (filters.status) {
      const pend = c.fields.some((e) => e.origin === "stage" && e.stageId === c.stageId && e.required && !isFilled(fieldById(e.fieldId), c.values[e.fieldId]));
      if (filters.status === "pending" && !pend) return false;
      if (filters.status === "ok" && pend) return false;
    }
    if (filters.fieldId) {
      const f = fieldById(filters.fieldId);
      const v = c.values[filters.fieldId];
      if (!isFilled(f, v)) return false;
      if (filters.fieldValue && !displayValue(f, v, state.users).toLowerCase().includes(filters.fieldValue.toLowerCase())) return false;
    }
    return true;
  };

  const visibleStages = board.stages.filter((s) => !filters.stages.length || filters.stages.includes(s.id));
  const cardsOf = (stageId) => state.cards.filter((c) => c.boardId === board.id && c.stageId === stageId && matches(c));

  const moveStage = (stageId, toIndex) => {
    setState((s) => ({
      ...s,
      boards: s.boards.map((b) => {
        if (b.id !== board.id) return b;
        const arr = [...b.stages];
        const from = arr.findIndex((x) => x.id === stageId);
        const [it] = arr.splice(from, 1);
        arr.splice(Math.min(Math.max(0, toIndex), arr.length), 0, it);
        return { ...b, stages: arr };
      }),
    }));
  };

  const createStage = () => {
    if (!stageName.trim()) return;
    setState((s) => ({ ...s, boards: s.boards.map((b) => (b.id !== board.id ? b : { ...b, stages: [...b.stages, { id: uid("stage"), name: stageName.trim(), fields: [] }] })) }));
    toast(`Etapa "${stageName.trim()}" criada.`);
    setStageName(""); setAddStage(false);
  };

  return (
    <div className="flex h-full flex-col">
      <div className="flex flex-col gap-2 border-b border-border bg-card px-5 py-3">
      <div className="flex flex-wrap items-center gap-3">
        <button onClick={onBack} title="Voltar para o Início"
          className="flex h-9 w-9 flex-none items-center justify-center rounded-lg border border-border text-muted-foreground transition-colors hover:border-[#04B9CD]/30 hover:text-foreground">
          <ArrowLeft size={18} />
        </button>
        <div className="relative flex items-center gap-3">
          <button onClick={() => canAdmin && setNamePopoverOpen((v) => !v)} disabled={!canAdmin} title="Definir cor e ícone"
            className={cx("flex h-9 w-9 flex-none items-center justify-center rounded-xl text-white transition-transform hover:scale-105", (BOARD_TONES[board.tone] || BOARD_TONES.slate).iconBg)}>
            {React.createElement(boardIconFor(board), { size: 16 })}
          </button>
          <button onClick={() => canAdmin && setNamePopoverOpen((v) => !v)} disabled={!canAdmin} className="rounded-lg px-1 -mx-1 py-0.5 text-left transition-colors hover:bg-muted/50">
            <h2 className="text-lg font-semibold text-foreground">{board.name}</h2>
            <p className="text-xs text-muted-foreground">{board.description} · {state.cards.filter((c) => c.boardId === board.id).length} cards</p>
          </button>
          {namePopoverOpen && <BoardNamePopover board={board} onClose={() => setNamePopoverOpen(false)} />}
        </div>
        <div className="ml-auto flex flex-wrap items-center gap-2">
          <div className="relative">
            <Search size={14} className="absolute left-2.5 top-2.5 text-muted-foreground" />
            <input className={cx(inp(), "h-9 w-52 pl-8")} placeholder="Filtrar nesta trilha..." value={filters.q} onChange={(e) => setFilters((f) => ({ ...f, q: e.target.value }))} />
          </div>
          <div className="relative">
            <Btn icon={Filter} onClick={() => setShowFilters((v) => !v)} className={activeCount ? "border-[#04B9CD]/30 text-primary" : ""}>
              Filtros{activeCount ? ` (${activeCount})` : ""}
            </Btn>
            {showFilters && <FiltersPanel board={board} filters={filters} setFilters={setFilters} onClose={() => setShowFilters(false)} />}
          </div>
          {activeCount > 0 && <Btn variant="ghost" size="sm" icon={X} onClick={() => setFilters(emptyFilters)}>Limpar</Btn>}
          <DropdownMenu items={[
            { label: "Pessoas", icon: Users, onClick: () => setPeopleOpen(true) },
            canAdmin && { label: "Exibição do card", icon: Eye, onClick: () => setSettings(true) },
          ].filter(Boolean)}>
            <Btn icon={Settings}>Gerenciar</Btn>
          </DropdownMenu>
          <Btn variant="primary" icon={Plus} onClick={() => setQuickAddStageId(board.stages[0]?.id || null)}>Novo card</Btn>
        </div>
      </div>
      {selMinistry && (
        <div className="flex flex-wrap items-center gap-2 pl-14">
          <Badge label={`🏛️ ${selMinistry.name}`} cls="bg-violet-50 text-violet-700 border-violet-200" />
          {selTeam && <Badge label={`👥 ${selTeam.name}`} cls="bg-blue-50 text-blue-700 border-blue-200" />}
          {selTeam && selTeam.members && selTeam.members.length > 0 && (
            <span className="text-xs text-muted-foreground">
              Participantes: {selTeam.members.slice(0, 4).join(", ")}{selTeam.members.length > 4 ? ` +${selTeam.members.length - 4}` : ""}
            </span>
          )}
        </div>
      )}
      </div>

      <div className="min-h-0 flex-1 overflow-x-auto overscroll-x-contain bg-background p-5 snap-x snap-proximity">
        <div className="flex h-full gap-4">
          {visibleStages.map((s) => (
            <Column key={s.id} board={board} stage={s} index={board.stages.findIndex((x) => x.id === s.id)}
              cards={cardsOf(s.id)} onOpen={openCard}
              onConfig={setConfigStage} drag={drag} setDrag={setDrag}
              onDropCard={(cardId, stageId) => requestMove(cardId, stageId)} onMoveStage={moveStage}
              onReorderCard={reorderCard}
              quickAddOpen={quickAddStageId === s.id}
              onOpenQuickAdd={() => setQuickAddStageId(s.id)}
              onCloseQuickAdd={() => setQuickAddStageId(null)} />
          ))}
          {canAdmin && (
            <div className="w-64 flex-none">
              {addStage ? (
                <div className="rounded-xl border border-border bg-card p-3">
                  <input autoFocus className={inp()} placeholder="Nome da etapa" value={stageName} onChange={(e) => setStageName(e.target.value)} onKeyDown={(e) => e.key === "Enter" && createStage()} />
                  <div className="mt-2 flex gap-1.5">
                    <Btn variant="primary" size="sm" onClick={createStage}>Criar etapa</Btn>
                    <Btn variant="ghost" size="sm" onClick={() => setAddStage(false)}>Cancelar</Btn>
                  </div>
                </div>
              ) : (
                <button onClick={() => setAddStage(true)} className="flex w-full items-center gap-1.5 rounded-xl border border-dashed border-border px-3 py-2.5 text-sm font-medium text-muted-foreground hover:border-[#04B9CD]/30 hover:bg-card hover:text-primary">
                  <Plus size={15} />Adicionar etapa
                </button>
              )}
            </div>
          )}
        </div>
      </div>

      <StageConfigModal open={!!configStage} board={board} stage={configStage ? board.stages.find((s) => s.id === configStage.id) : null} onClose={() => setConfigStage(null)} />
      <BoardDisplayModal open={settings} board={board} onClose={() => setSettings(false)} />
      {peopleOpen && <BoardPeopleModal board={board} onClose={() => setPeopleOpen(false)} />}
    </div>
  );
}

function BoardDisplayModal({ open, board, onClose }: any) {
  const { setState, fieldById } = useApp();
  if (!open) return null;
  const d = board.display;
  const set = (patch) => setState((s) => ({ ...s, boards: s.boards.map((b) => (b.id === board.id ? { ...b, display: { ...b.display, ...patch } } : b)) }));
  const boardFieldIds = [...new Set(board.stages.flatMap((st) => st.fields.map((f) => f.fieldId)))];
  const toggleField = (fid) => set({ fields: d.fields.includes(fid) ? d.fields.filter((x) => x !== fid) : [...d.fields, fid] });
  return (
    <Modal open={open} onClose={onClose} width={520} title="Mostrar no card fechado" subtitle="Escolha o que aparece nos cards do Kanban. A trilha atualiza na hora."
      footer={<Btn variant="primary" onClick={onClose}>Concluir</Btn>}>
      <div className="space-y-1">
        {[["code", "ID do card"], ["assignees", "Responsável"], ["due", "Prazo"], ["labels", "Etiquetas"], ["checklist", "Indicador de checklist"], ["comments", "Indicador de comentários"], ["attachments", "Indicador de anexos"]].map(([k, label]) => (
          <ToggleRow key={k} checked={d[k]} onChange={(v) => set({ [k]: v })} label={label} />
        ))}
      </div>
      <div className="mt-4">
        <SectionTitle>Campos desta trilha</SectionTitle>
        <div className="space-y-1">
          {boardFieldIds.map((fid) => {
            const f = fieldById(fid);
            return f ? <ToggleRow key={fid} checked={d.fields.includes(fid)} onChange={() => toggleField(fid)} label={f.name} desc={TYPE[f.type].label} /> : null;
          })}
        </div>
      </div>
    </Modal>
  );
}

function OptionalFieldsModal({ prompt, onClose, onApply }: any) {
  const { fieldById, boardById } = useApp();
  const [sel, setSel] = useState(prompt.fieldIds);
  const board = boardById(prompt.boardId);
  const stage = board.stages.find((s) => s.id === prompt.stageId);
  return (
    <Modal open onClose={onClose} width={520} zIndex={75}
      title={`Esta etapa possui campos opcionais. Deseja adicioná-los ao card?`}
      subtitle={`Etapa ${stage.name} · escolha o que faz sentido para este card`}
      footer={<><Btn onClick={onClose}>Ignorar</Btn><Btn variant="primary" disabled={sel.length === 0} onClick={() => { onApply(sel); onClose(); }}>Aplicar {sel.length > 0 ? `(${sel.length})` : ""}</Btn></>}>
      <div className="space-y-1">
        {prompt.fieldIds.map((fid) => {
          const f = fieldById(fid);
          return <ToggleRow key={fid} checked={sel.includes(fid)} onChange={() => setSel((s) => (s.includes(fid) ? s.filter((x) => x !== fid) : [...s, fid]))} label={f.name} desc={TYPE[f.type].label} />;
        })}
      </div>
    </Modal>
  );
}

function BlockedMoveModal({ blocked, onClose, onFill }: any) {
  const { fieldById } = useApp();
  return (
    <Modal open onClose={onClose} width={480} zIndex={75} title="Não é possível avançar este card"
      subtitle={`Preencha os seguintes campos obrigatórios da etapa ${blocked.fromName}:`}
      footer={<><Btn onClick={onClose}>Fechar</Btn><Btn variant="primary" onClick={onFill}>Preencher agora</Btn></>}>
      <ul className="space-y-1.5">
        {blocked.pending.map((e) => (
          <li key={e.id} className="flex items-center gap-2 rounded-lg border border-amber-200 bg-amber-50 px-3 py-2 text-sm text-amber-800">
            <AlertTriangle size={14} />{fieldById(e.fieldId).name}
          </li>
        ))}
      </ul>
      <p className="mt-3 text-xs text-muted-foreground">O card permanece em {blocked.fromName} até que os campos sejam preenchidos.</p>
    </Modal>
  );
}

// ─── Kanban: cores e ícones das trilhas (estilo Pipefy) ────────────────────────
const BOARD_TONES: Record<string, { cardBg: string; iconBg: string; dot: string; label: string }> = {
  blue: { cardBg: "bg-blue-50", iconBg: "bg-blue-600", dot: "bg-blue-500", label: "Azul" },
  emerald: { cardBg: "bg-emerald-50", iconBg: "bg-emerald-600", dot: "bg-emerald-500", label: "Verde" },
  violet: { cardBg: "bg-violet-50", iconBg: "bg-violet-600", dot: "bg-violet-500", label: "Roxo" },
  amber: { cardBg: "bg-amber-50", iconBg: "bg-amber-500", dot: "bg-amber-400", label: "Amarelo" },
  rose: { cardBg: "bg-rose-50", iconBg: "bg-rose-600", dot: "bg-rose-500", label: "Rosa" },
  orange: { cardBg: "bg-orange-50", iconBg: "bg-orange-600", dot: "bg-orange-500", label: "Laranja" },
  pink: { cardBg: "bg-pink-50", iconBg: "bg-pink-600", dot: "bg-pink-500", label: "Pink" },
  slate: { cardBg: "bg-slate-50", iconBg: "bg-slate-600", dot: "bg-slate-500", label: "Cinza" },
};
const BOARD_ICON_OPTIONS = [
  { key: "kanban", icon: KanbanSquare }, { key: "settings", icon: Settings }, { key: "dollar", icon: DollarSign },
  { key: "layers", icon: Layers }, { key: "file", icon: FileText }, { key: "users", icon: Users },
  { key: "search", icon: Search }, { key: "shield", icon: Shield }, { key: "calendar", icon: Calendar },
  { key: "tag", icon: Tags }, { key: "card", icon: CreditCard }, { key: "mail", icon: Mail },
];
function boardIconFor(board: any) {
  if (board.icon) return (BOARD_ICON_OPTIONS.find((o) => o.key === board.icon) || {}).icon || KanbanSquare;
  if (board.id === "b1") return Settings;
  if (board.id === "b2") return DollarSign;
  if (board.id === "b3") return Layers;
  if (board.id === "b4") return FileText;
  return KanbanSquare;
}
function BoardIconColorPicker({ tone, iconKey, onPickTone, onPickIcon, onClose }: any) {
  const ref = useRef(null);
  useOutside(ref, onClose);
  return (
    <div ref={ref} className="absolute right-0 top-7 rounded-xl border border-border bg-card p-3 shadow-lg" style={{ zIndex: 50, width: 220 }} onClick={(e) => e.stopPropagation()}>
      <div className="mb-2.5">
        <div className="mb-1.5 text-[10px] font-semibold uppercase tracking-wide text-muted-foreground">Cor</div>
        <div className="grid grid-cols-8 gap-1.5">
          {Object.entries(BOARD_TONES).map(([key, def]) => (
            <button key={key} onClick={() => onPickTone(key)} title={def.label}
              className={cx("h-5 w-5 rounded-full border-2 transition-transform hover:scale-110", def.dot, tone === key ? "border-foreground" : "border-transparent")} />
          ))}
        </div>
      </div>
      <div>
        <div className="mb-1.5 text-[10px] font-semibold uppercase tracking-wide text-muted-foreground">Ícone</div>
        <div className="grid grid-cols-6 gap-1.5">
          {BOARD_ICON_OPTIONS.map((o) => (
            <button key={o.key} onClick={() => onPickIcon(o.key)}
              className={cx("flex h-7 w-7 items-center justify-center rounded-lg border transition-colors", iconKey === o.key ? "border-[#04B9CD]/50 bg-[#04B9CD]/10 text-[#04B9CD]" : "border-border text-muted-foreground hover:bg-muted/50")}>
              <o.icon size={14} />
            </button>
          ))}
        </div>
      </div>
    </div>
  );
}

function TemplatesView() {
  const { state, setState, canAdmin, toast, fieldById } = useApp();
  const [editing, setEditing] = useState<any>(null);
  const [picker, setPicker] = useState(false);

  const save = () => {
    setState((s) => ({ ...s, templates: s.templates.some((t) => t.id === editing.id) ? s.templates.map((t) => (t.id === editing.id ? editing : t)) : [...s.templates, editing] }));
    toast(`Template "${editing.name}" salvo.`);
    setEditing(null);
  };
  const move = (i, dir) => setEditing((e) => { const arr = [...e.fieldIds]; const j = i + dir; if (j < 0 || j >= arr.length) return e; [arr[i], arr[j]] = [arr[j], arr[i]]; return { ...e, fieldIds: arr }; });

  return (
    <div className="mx-auto max-w-5xl p-6">
      <div className="mb-5 flex items-center justify-between">
        <div>
          <h2 className="text-xl font-semibold text-foreground">Templates</h2>
          <p className="text-sm text-muted-foreground">Conjuntos reutilizáveis de campos, aplicáveis a uma etapa ou direto a um card.</p>
        </div>
        {canAdmin && <Btn variant="primary" icon={Plus} onClick={() => setEditing({ id: uid("tpl"), name: "", description: "", fieldIds: [] })}>Novo template</Btn>}
      </div>

      <div className="grid gap-3 sm:grid-cols-2">
        {state.templates.map((t) => (
          <div key={t.id} className="rounded-2xl border border-border bg-card p-4">
            <div className="flex items-start justify-between">
              <div>
                <h3 className="text-sm font-semibold text-foreground">{t.name}</h3>
                <p className="text-xs text-muted-foreground">{t.description}</p>
              </div>
              {canAdmin && (
                <DropdownMenu items={[
                  { label: "Editar", icon: Pencil, onClick: () => setEditing(t) },
                  { label: "Duplicar", icon: Copy, onClick: () => { setState((s) => ({ ...s, templates: [...s.templates, { ...t, id: uid("tpl"), name: t.name + " (cópia)" }] })); toast("Template duplicado."); } },
                  { sep: true },
                  { label: "Excluir", icon: Trash2, danger: true, onClick: () => setState((s) => ({ ...s, templates: s.templates.filter((x) => x.id !== t.id) })) },
                ]}><Btn variant="ghost" size="iconsm"><MoreHorizontal size={15} /></Btn></DropdownMenu>
              )}
            </div>
            <div className="mt-3 space-y-1">
              {t.fieldIds.map((fid) => {
                const f = fieldById(fid); if (!f) return null;
                const Icon = TYPE[f.type].icon;
                return <div key={fid} className="flex items-center gap-2 text-xs text-muted-foreground"><Icon size={13} className="text-muted-foreground/70" />{f.name}<span className="text-muted-foreground/70">· {TYPE[f.type].label}</span></div>;
              })}
            </div>
          </div>
        ))}
      </div>

      {editing && (
        <>
          <Modal open onClose={() => setEditing(null)} width={600} title={state.templates.some((t) => t.id === editing.id) ? "Editar template" : "Novo template"}
            footer={<><Btn onClick={() => setEditing(null)}>Cancelar</Btn><Btn variant="primary" onClick={save} disabled={!editing.name.trim()}>Salvar template</Btn></>}>
            <div className="space-y-4">
              <Field label="Nome"><input autoFocus className={inp()} value={editing.name} onChange={(e) => setEditing({ ...editing, name: e.target.value })} placeholder="Ex.: Dados do Cliente" /></Field>
              <Field label="Descrição"><input className={inp()} value={editing.description} onChange={(e) => setEditing({ ...editing, description: e.target.value })} /></Field>
              <div>
                <SectionTitle right={<Btn size="sm" icon={Plus} onClick={() => setPicker(true)}>Adicionar campo</Btn>}>Campos do template</SectionTitle>
                {editing.fieldIds.length === 0 ? <Empty icon={Layers} title="Sem campos">Adicione campos da biblioteca ou crie novos.</Empty> : (
                  <div className="space-y-1.5">
                    {editing.fieldIds.map((fid, i) => {
                      const f = fieldById(fid); if (!f) return null;
                      const Icon = TYPE[f.type].icon;
                      return (
                        <div key={fid} className="flex items-center gap-2 rounded-xl border border-border px-2.5 py-2">
                          <div className="flex flex-col">
                            <button className="text-muted-foreground/40 hover:text-foreground disabled:opacity-30" disabled={i === 0} onClick={() => move(i, -1)}><ArrowUp size={12} /></button>
                            <button className="text-muted-foreground/40 hover:text-foreground disabled:opacity-30" disabled={i === editing.fieldIds.length - 1} onClick={() => move(i, 1)}><ArrowDown size={12} /></button>
                          </div>
                          <Icon size={15} className="text-muted-foreground" />
                          <span className="flex-1 text-sm text-foreground">{f.name}</span>
                          <span className="text-xs text-muted-foreground">{TYPE[f.type].label}</span>
                          <Btn variant="ghost" size="iconsm" onClick={() => setEditing({ ...editing, fieldIds: editing.fieldIds.filter((x) => x !== fid) })}><Trash2 size={13} /></Btn>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            </div>
          </Modal>
          <FieldPicker open={picker} onClose={() => setPicker(false)} excludeIds={editing.fieldIds} onPick={(fid) => setEditing((e) => ({ ...e, fieldIds: [...e.fieldIds, fid] }))} zIndex={85} />
        </>
      )}
    </div>
  );
}

          { label: "Com prazo vencido", value: late.length, icon: AlertTriangle, tone: "rose" },
        ].map((s) => {
          const toneDef = BOARD_TONES[s.tone] || BOARD_TONES.slate;
          return (
            <div key={s.label} className="rounded-2xl border border-border bg-card p-4">

              <p className="text-xs text-muted-foreground">{s.label}</p>

            <span className="flex h-10 w-10 items-center justify-center rounded-xl bg-[#04B9CD]/10 text-[#04B9CD]"><Plus size={20} /></span>
            <span className="text-sm font-semibold text-[#04B9CD]">Criar Trilha</span>
          </button>
        )}

          const Icon = boardIconFor(b);

              <button onClick={(e) => { e.stopPropagation(); setState((s) => ({ ...s, boards: s.boards.map((x) => (x.id === b.id ? { ...x, favorite: !x.favorite } : x)) })); }}
                title={b.favorite ? "Remover dos favoritos" : "Marcar como favorito"}
                className={cx("absolute right-3 top-3 transition-opacity", b.favorite ? "opacity-100" : "opacity-0 group-hover:opacity-100")}>

                    canAdmin && { sep: true },

                  ]}>

                  {colorPickerFor === b.id && (
                    <BoardIconColorPicker
                      tone={b.tone || "slate"} iconKey={b.icon}
                      onClose={() => setColorPickerFor(null)}
                      onPickTone={(t) => setState((s) => ({ ...s, boards: s.boards.map((x) => (x.id === b.id ? { ...x, tone: t } : x)) }))}
                      onPickIcon={(k) => setState((s) => ({ ...s, boards: s.boards.map((x) => (x.id === b.id ? { ...x, icon: k } : x)) }))}
                    />
                  )}
                </div>
              </div>
            </div>

              <button key={c.id} onClick={() => openCard(c.id)} className="flex w-full items-center gap-2.5 rounded-xl border border-border bg-card px-3 py-2.5 text-left hover:border-[#04B9CD]/25">
                <span className="font-mono text-xs text-muted-foreground">{c.code}</span>
                <span className="min-w-0 flex-1 truncate text-sm text-foreground">{c.title}</span>
                {c.due && <span className={cx("text-xs", isLate(c.due) ? "font-medium text-red-500" : "text-muted-foreground")}>{fmtRelDate(c.due)}</span>}
              </button>
            ))}
          </div>
        </div>
        <div>
          <SectionTitle>Atividade recente</SectionTitle>
          <div className="space-y-1.5">
            {recent.map((h) => {
              const u = state.users.find((x) => x.id === h.userId);
              return (
                <button key={h.id} onClick={() => openCard(h.card.id)} className="flex w-full items-start gap-2.5 rounded-xl border border-border bg-card px-3 py-2.5 text-left hover:border-[#04B9CD]/25">

                  <span className="min-w-0 flex-1">

                  </span>
                </button>
              );
            })}
          </div>
        </div>
      </div>
    </div>

    <Modal open={creating} onClose={closeCreate} width={480} title="Criar Trilha" subtitle="Comece a trabalhar em segundos — você personaliza o resto depois."
      footer={<><Btn onClick={closeCreate}>Cancelar</Btn><Btn variant="primary" onClick={create} disabled={!name.trim()}>Criar Trilha</Btn></>}>
      <div className="space-y-4">
        <Field label="Nome da Trilha">
          <input autoFocus className={inp(false)} value={name} onChange={(e) => setName(e.target.value)}
            onKeyDown={(e) => e.key === "Enter" && name.trim() && create()}
            placeholder="Ex.: Comunicação • Culto de Domingo" />
        </Field>
        <Field label="Descrição" hint="Opcional">
          <textarea rows={2} className={inp()} value={description} onChange={(e) => setDescription(e.target.value)}
            placeholder="Ex.: Organização das demandas de comunicação do culto." />
        </Field>
        <div className="flex items-start gap-2.5 rounded-xl border border-border bg-muted/30 px-3.5 py-3">

          <p className="text-xs text-muted-foreground">

            Você pode renomear, adicionar, reordenar ou remover colunas quando quiser, direto no board.
          </p>
        </div>
      </div>
    </Modal>

    <Modal open={!!renaming} onClose={() => setRenaming(null)} width={420} title="Renomear Trilha"
      footer={<><Btn onClick={() => setRenaming(null)}>Cancelar</Btn><Btn variant="primary" onClick={() => { setState((s) => ({ ...s, boards: s.boards.map((b) => (b.id === renaming.id ? { ...b, name: renaming.name } : b)) })); setRenaming(null); }}>Salvar</Btn></>}>
      {renaming && <input autoFocus className={inp()} value={renaming.name} onChange={(e) => setRenaming({ ...renaming, name: e.target.value })} />}
    </Modal>

    {membersFor && (() => {
      const b = state.boards.find((x) => x.id === membersFor);
      if (!b) return null;
      return <BoardPeopleModal board={b} onClose={() => setMembersFor(null)} />;
    })()}
    </>
  );
}

  const canAdmin = role === "admin";

  const toast = useCallback((text) => {
    const id = uid("t");
    setToasts((t) => [...t, { id, text }]);
    setTimeout(() => setToasts((t) => t.filter((x) => x.id !== id)), 3400);
  }, []);

  const fieldById = useCallback((id) => state.fields.find((f) => f.id === id), [state.fields]);
  const boardById = useCallback((id) => state.boards.find((b) => b.id === id), [state.boards]);
  const cardById = useCallback((id) => state.cards.find((c) => c.id === id), [state.cards]);

  const updateCard = useCallback((id, fn) => {
    setState((s) => (fn === null ? { ...s, cards: s.cards.filter((c) => c.id !== id) } : { ...s, cards: s.cards.map((c) => (c.id === id ? fn(c) : c)) }));
  }, []);

  const log = useCallback((cardId, text, dedupKey) => {
    setState((s) => ({
      ...s,
      cards: s.cards.map((c) => {
        if (c.id !== cardId) return c;
        const entry = { id: uid("h"), at: Date.now(), userId: role === "admin" ? "u1" : "u2", text, key: dedupKey };
        const first = c.history[0];
        if (dedupKey && first && first.key === dedupKey && Date.now() - first.at < 120000) return { ...c, history: [entry, ...c.history.slice(1)] };
        return { ...c, history: [entry, ...c.history] };
      }),
    }));
  }, [role]);

  const setValue = useCallback((cardId, field, v) => {
    const c0 = state.cards.find((c) => c.id === cardId);
    const oldV = c0 ? c0.values[field.id] : undefined;
    updateCard(cardId, (c) => ({ ...c, values: { ...c.values, [field.id]: v } }));
    const trim = (s) => (s && s.length > 60 ? s.slice(0, 60) + "…" : s || "vazio");
    const oldDisp = trim(isFilled(field, oldV) ? displayValue(field, oldV, state.users) : "");
    const newDisp = trim(isFilled(field, v) ? displayValue(field, v, state.users) : "");
    log(cardId, `Campo "${field.name}" alterado: "${oldDisp}" → "${newDisp}"`, "val_" + field.id);
  }, [state.cards, state.users, updateCard, log]);

  const setCardField = useCallback((cardId, fieldId, remove) => {
    const f = state.fields.find((x) => x.id === fieldId);
    updateCard(cardId, (c) => remove
      ? { ...c, fields: c.fields.filter((e) => e.fieldId !== fieldId) }
      : { ...c, fields: [...c.fields, { id: uid("ent"), fieldId, required: false, origin: "card", stageId: null }] });
    log(cardId, remove ? `Campo "${f.name}" removido do card` : `Campo "${f.name}" adicionado ao card`);
  }, [state.fields, updateCard, log]);

  const renameCardField = useCallback((cardId, entryId, newLabel) => {
    const c0 = state.cards.find((c) => c.id === cardId);
    const entry0 = c0?.fields.find((e) => e.id === entryId);
    if (!entry0) return;
    const fld = state.fields.find((f) => f.id === entry0.fieldId);
    const oldLabel = entry0.label || fld?.name || "";
    const v = (newLabel || "").trim();
    updateCard(cardId, (c) => ({ ...c, fields: c.fields.map((e) => (e.id === entryId ? { ...e, label: v || undefined } : e)) }));
    const finalLabel = v || fld?.name || "";
    if (finalLabel !== oldLabel) log(cardId, `Campo "${oldLabel}" renomeado para "${finalLabel}" neste card`);
  }, [state.cards, state.fields, updateCard, log]);

  const createField = useCallback((data) => {
    const id = uid("f");
    setState((s) => ({ ...s, fields: [...s.fields, { id, ...data, createdBy: role === "admin" ? "u1" : "u2" }] }));
    toast(`Campo "${data.name}" criado na biblioteca.`);
    return id;
  }, [role, toast]);

  const fieldUsage = useCallback((fieldId) => {
    const stages = [];
    state.boards.forEach((b) => b.stages.forEach((s) => {
      const f = s.fields.find((x) => x.fieldId === fieldId);
      if (f) stages.push({ board: b.name, stage: s.name, required: f.required });
    }));
    const cards = state.cards.filter((c) => c.fields.some((e) => e.fieldId === fieldId));
    return { stages, cards };
  }, [state.boards, state.cards]);

  const applyStageFields = (card, stage) => {
    const add = stage.fields.filter((f) => f.required && !card.fields.some((e) => e.fieldId === f.fieldId))
      .map((f) => ({ id: uid("ent"), fieldId: f.fieldId, required: true, origin: "stage", stageId: stage.id }));
    return add;
  };

  const requestMove = useCallback((cardId, toStageId) => {
    const card = state.cards.find((c) => c.id === cardId);
    if (!card || card.stageId === toStageId) return;
    const board = state.boards.find((b) => b.id === card.boardId);
    const from = board.stages.find((s) => s.id === card.stageId);
    const to = board.stages.find((s) => s.id === toStageId);
    const pending = card.fields.filter((e) => e.origin === "stage" && e.stageId === card.stageId && e.required && !isFilled(state.fields.find((f) => f.id === e.fieldId), card.values[e.fieldId]));
    if (pending.length) { setBlocked({ cardId, pending, fromName: from.name, toName: to.name }); return; }

    const add = applyStageFields(card, to);
    updateCard(cardId, (c) => ({ ...c, stageId: toStageId, fields: [...c.fields, ...add] }));
    log(cardId, `Card movido de ${from.name} para ${to.name}`);
    if (add.length) log(cardId, `${add.length} campo(s) obrigatório(s) da etapa ${to.name} adicionados automaticamente`);
    toast(`${card.code} movido para ${to.name}${add.length ? ` · ${add.length} campo(s) obrigatório(s) adicionados` : ""}`);
  }, [state.cards, state.boards, state.fields, updateCard, log, toast]);

  const reorderCard = useCallback((draggedId, targetId) => {
    if (draggedId === targetId) return;
    const dragged = state.cards.find((c) => c.id === draggedId);
    const target = state.cards.find((c) => c.id === targetId);
    if (!dragged || !target || dragged.boardId !== target.boardId) return;

    if (dragged.stageId !== target.stageId) {
      const board = state.boards.find((b) => b.id === dragged.boardId);
      const from = board.stages.find((s) => s.id === dragged.stageId);
      const to = board.stages.find((s) => s.id === target.stageId);
      const pending = dragged.fields.filter((e) => e.origin === "stage" && e.stageId === dragged.stageId && e.required && !isFilled(state.fields.find((f) => f.id === e.fieldId), dragged.values[e.fieldId]));
      if (pending.length) { setBlocked({ cardId: draggedId, pending, fromName: from.name, toName: to.name }); return; }
      const add = applyStageFields(dragged, to);
      setState((s) => {
        let cards = s.cards.map((c) => (c.id === draggedId ? { ...c, stageId: to.id, fields: [...c.fields, ...add] } : c));
        const fromIdx = cards.findIndex((c) => c.id === draggedId);
        const [moved] = cards.splice(fromIdx, 1);
        const toIdx = cards.findIndex((c) => c.id === targetId);
        cards.splice(toIdx, 0, moved);
        return { ...s, cards };
      });
      log(draggedId, `Card movido de ${from.name} para ${to.name}`);
      if (add.length) log(draggedId, `${add.length} campo(s) obrigatório(s) da etapa ${to.name} adicionados automaticamente`);
      toast(`${dragged.code} movido para ${to.name}`);
    } else {
      setState((s) => {
        const cards = [...s.cards];
        const fromIdx = cards.findIndex((c) => c.id === draggedId);
        const [moved] = cards.splice(fromIdx, 1);
        const toIdx = cards.findIndex((c) => c.id === targetId);
        cards.splice(toIdx, 0, moved);
        return { ...s, cards };
      });
    }
  }, [state.cards, state.boards, state.fields, setState, log, toast]);

  const applyOptional = (fieldIds) => {
    const { cardId, stageId } = optionalPrompt;
    updateCard(cardId, (c) => ({ ...c, fields: [...c.fields, ...fieldIds.map((fid) => ({ id: uid("ent"), fieldId: fid, required: false, origin: "stage", stageId })) ] }));
    log(cardId, `${fieldIds.length} campo(s) opcional(is) da etapa aplicados`);
    toast(`${fieldIds.length} campo(s) opcional(is) aplicados ao card.`);
  };

  const createCard = useCallback((cfg) => {
    const board = state.boards.find((b) => b.id === cfg.boardId);
    const stage = board.stages.find((s) => s.id === cfg.stageId);
    const code = "#" + String(state.nextCode).padStart(6, "0");
    const tpl = state.templates.find((t) => t.id === cfg.tplId);
    const entries = stage.fields.filter((f) => f.required).map((f) => ({ id: uid("ent"), fieldId: f.fieldId, required: true, origin: "stage", stageId: stage.id }));
    if (tpl) tpl.fieldIds.forEach((fid) => { if (!entries.some((e) => e.fieldId === fid)) entries.push({ id: uid("ent"), fieldId: fid, required: false, origin: "card", stageId: null }); });
    const card = {
      id: uid("card"), code, boardId: board.id, stageId: stage.id, title: cfg.title, description: "",
      assignees: cfg.assignees || [], due: cfg.due || null, labels: cfg.labels || [],
      priority: cfg.priority || null,
      ministryId: cfg.ministryId ?? board.ministryId ?? null,
      teamId: cfg.teamId ?? board.teamId ?? null,
      origin: cfg.origin || "",
      fields: entries, values: {}, checklists: [], subtasks: [], comments: [], attachments: [],
      history: [
        ...(tpl ? [{ id: uid("h"), at: Date.now(), userId: me.id, text: `Template "${tpl.name}" aplicado ao card` }] : []),
        { id: uid("h"), at: Date.now(), userId: me.id, text: `Card criado na etapa ${stage.name}` },
      ],
      createdBy: me.id, createdAt: Date.now(),
    };
    setState((s) => ({ ...s, cards: [...s.cards, card], nextCode: s.nextCode + 1 }));
    if (!cfg.silent) {
      toast(`${code} criado em ${stage.name}.`);
      setOpenCardId(card.id);
      const optionals = stage.fields.filter((f) => !f.required && !entries.some((e) => e.fieldId === f.fieldId));
      if (optionals.length) setOptionalPrompt({ cardId: card.id, boardId: board.id, stageId: stage.id, fieldIds: optionals.map((f) => f.fieldId) });
    }
  }, [state.boards, state.templates, state.nextCode, me, toast]);

  const go = useCallback((r) => { setRoute(r); setOpenCardId(null); }, []);
  const openCard = useCallback((id) => setOpenCardId(id), []);
  const reset = useCallback(() => { setState(initialState()); setRoute({ view: "home" }); setOpenCardId(null); }, []);

  const ctx = {
    state, setState, me, role, setRole, canAdmin, route, go, openCard, toast,
    fieldById, boardById, cardById, updateCard, log, setValue, setCardField, renameCardField, createField,
    fieldUsage, requestMove, reorderCard, createCard, highlight, setHighlight, reset,
  };

  const board = route.boardId ? state.boards.find((b) => b.id === route.boardId) : null;
  const openCardObj = openCardId ? state.cards.find((c) => c.id === openCardId) : null;

  const searchResults = useMemo(() => {
    const term = q.trim().toLowerCase().replace("#", "");
    if (!term) return [];
    return state.cards.filter((c) => {
      if (c.code.toLowerCase().replace("#", "").includes(term)) return true;
      if (c.title.toLowerCase().includes(term)) return true;
      if (c.description.toLowerCase().includes(term)) return true;
      return Object.keys(c.values).some((fid) => {
        const f = state.fields.find((x) => x.id === fid);
        return f && displayValue(f, c.values[fid], state.users).toLowerCase().includes(term);
      });
    }).slice(0, 8);
  }, [q, state.cards, state.fields, state.users]);

  const NAV = [
    { id: "home", label: "Início", icon: LayoutDashboard },
    { id: "templates", label: "Templates", icon: LayoutTemplate },
    { id: "library", label: "Biblioteca", icon: Library },
    { id: "users", label: "Usuários", icon: Users },
  ];

  return (
    <AppCtx.Provider value={ctx}>
      {route.view === "board" ? (
        <div className="flex h-full flex-col -m-6">
          {board ? <BoardView board={board} onBack={() => go({ view: "home" })} /> : <div className="p-6"><Empty title="Trilha não encontrada" /></div>}
        </div>
      ) : (
      <div className="flex h-full flex-col">
        <div className="flex flex-wrap items-start justify-between gap-4 mb-1">
          <div>
            <h2 className="text-lg font-bold text-foreground">Kanban</h2>
            <p className="text-sm text-muted-foreground mt-0.5">Gerencie processos com etapas, campos dinâmicos e cards configuráveis.</p>
          </div>
          <div className="flex items-center gap-2">
            <div className="relative" ref={searchRef}>
              <Search size={14} className="absolute left-3 top-1/2 -translate-y-1/2 text-muted-foreground" />
              <input className={cx(inp(), "h-9 w-56 pl-9")} placeholder="Buscar card por ID, título..." value={q} onChange={(e) => setQ(e.target.value)} />
              {q.trim() && (
                <div className="absolute inset-x-0 top-11 rounded-xl border border-border bg-card p-1.5 shadow-xl" style={{ zIndex: 45 }}>
                  {searchResults.length === 0 ? <p className="px-3 py-4 text-center text-sm text-muted-foreground">Nenhum card encontrado para "{q}".</p> : searchResults.map((c) => {
                    const b = state.boards.find((x) => x.id === c.boardId);
                    const s = b.stages.find((x) => x.id === c.stageId);
                    return (
                      <button key={c.id} onClick={() => { go({ view: "board", boardId: c.boardId }); openCard(c.id); setQ(""); }}
                        className="flex w-full items-center gap-2.5 rounded-lg px-2.5 py-2 text-left hover:bg-muted/40">
                        <span className="font-mono text-xs font-semibold text-muted-foreground">{c.code}</span>
                        <span className="min-w-0 flex-1 truncate text-sm text-foreground">{c.title}</span>
                        <span className="text-xs text-muted-foreground">{b.name} · {s.name}</span>
                      </button>
                    );
                  })}
                </div>
              )}
            </div>
            <button onClick={() => setRole(role === "admin" ? "user" : "admin")}
              className="flex items-center gap-1.5 rounded-lg border border-border bg-card px-3 py-2 text-xs font-medium text-muted-foreground hover:text-foreground transition-colors">
              {canAdmin ? <Shield size={13} className="text-primary" /> : <UserIcon size={13} />}
              {canAdmin ? "Administrador" : "Usuário"}
            </button>
          </div>
        </div>

        <div className="flex items-center gap-1 border-b border-border overflow-x-auto mb-5">
          {NAV.map(it => (
            <button key={it.id} onClick={() => go({ view: it.id })}
              className={cx("flex items-center gap-1.5 px-3.5 py-2.5 text-sm font-medium whitespace-nowrap border-b-2 transition-colors flex-shrink-0",
                route.view === it.id ? "border-primary text-primary" : "border-transparent text-muted-foreground hover:text-foreground")}>
              <it.icon size={13} /> {it.label}
            </button>
          ))}
        </div>

        <div className="min-h-0 flex-1 -mx-6 -mb-6 overflow-y-auto">
          {route.view === "home" && <HomeView />}
          {route.view === "templates" && <TemplatesView />}
          {route.view === "library" && <LibraryView />}
          {route.view === "users" && <UsersView />}
        </div>
      </div>
      )}

      {openCardObj && <CardDrawer card={openCardObj} onClose={() => setOpenCardId(null)} />}
      {optionalPrompt && <OptionalFieldsModal prompt={optionalPrompt} onClose={() => setOptionalPrompt(null)} onApply={applyOptional} />}
      {blocked && (
        <BlockedMoveModal blocked={blocked} onClose={() => setBlocked(null)}
          onFill={() => { setOpenCardId(blocked.cardId); setHighlight(blocked.pending.map((e) => e.fieldId)); setBlocked(null); setTimeout(() => setHighlight([]), 6000); }} />
      )}

      <div className="fixed bottom-4 right-4 space-y-2" style={{ zIndex: 95 }}>
        {toasts.map((t) => (
          <div key={t.id} className="flex max-w-sm items-start gap-2.5 rounded-xl border border-border bg-foreground px-3.5 py-2.5 text-sm text-background shadow-xl">
            <Sparkles size={15} className="mt-0.5 flex-none text-[#04B9CD]" />{t.text}
          </div>
        ))}
      </div>
    </AppCtx.Provider>
  );
}

// ── Constants ────────────────────────────────────────────────────────────────
const BR_STATES = ["AC","AL","AP","AM","BA","CE","DF","ES","GO","MA","MT","MS","MG","PA","PB","PR","PE","PI","RJ","RN","RS","RO","RR","SC","SP","SE","TO"];
const CIVIL_OPT = ["Solteiro(a)","Casado(a)","Divorciado(a)","Viúvo(a)","União Estável"];
const STATUS_OPT: MemberStatus[] = ["Ativo","Visitante","Membro","Líder","Pastor","Inativo","Em acompanhamento"];

// ── Form primitives ──────────────────────────────────────────────────────────
const inp = (err?: boolean) =>

const sel = (err?: boolean) => `${inp(err)} appearance-none cursor-pointer pr-8`;

const FL = ({ t, req }: { t: string; req?: boolean }) => (

const Err = ({ msg }: { msg?: string }) =>

const SelWrap = ({ children }: { children: React.ReactNode }) => (

const StepHd = ({ title, desc }: { title: string; desc: string }) => (

);

// ── Stepper ──────────────────────────────────────────────────────────────────
type StepDef = { label: string; icon: React.ElementType };

const Stepper = ({ steps, current }: { steps: StepDef[]; current: number }) => {
  const items: React.ReactNode[] = [];
  steps.forEach((s, i) => {
    const done = i < current;
    const active = i === current;
    items.push(
      <div key={`step-${i}`} className="flex flex-col items-center gap-1.5 flex-shrink-0">
        <div className={`w-10 h-10 rounded-full border-2 flex items-center justify-center transition-all duration-300 ${
          done  ? "bg-primary border-primary shadow-sm" :
          active ? "border-primary bg-primary/8 shadow-sm" :
                   "border-border bg-card"
        }`}>
          {done
            ? <Check size={15} className="text-primary-foreground"/>
            : <s.icon size={15} className={active ? "text-primary" : "text-muted-foreground"}/>
          }
        </div>
        <span className={`text-[10px] font-semibold text-center leading-tight hidden sm:block max-w-[56px] ${
          active ? "text-primary" : done ? "text-foreground" : "text-muted-foreground"
        }`}>{s.label}</span>
      </div>
    );
    if (i < steps.length - 1) {
      items.push(
        <div key={`line-${i}`} className={`flex-1 h-0.5 mt-5 mx-1 rounded-full transition-all duration-500 ${i < current ? "bg-primary" : "bg-border"}`}/>
      );
    }
  });
  return <div className="flex items-start mb-8">{items}</div>;
};

// ── Wizard shell ─────────────────────────────────────────────────────────────
interface WizardProps {
  title: string; subtitle: string; badge: string;
  steps: StepDef[]; current: number;
  onBack: () => void; onNext: () => void; onSubmit: () => void; onCancel: () => void;
  children: React.ReactNode;
}
function WizardShell({ title, subtitle, badge, steps, current, onBack, onNext, onSubmit, onCancel, children }: WizardProps) {
  const isLast = current === steps.length - 1;
  const progress = Math.round((current / (steps.length - 1)) * 100);
  return (
    <div className="max-w-2xl">
      <div className="flex items-start justify-between mb-6">
        <div>
          <div className="flex items-center gap-2 mb-1.5">
            <button onClick={onCancel} className="flex items-center gap-1 text-xs text-muted-foreground hover:text-foreground transition-colors">
              <ChevronLeft size={13}/> Voltar
            </button>
            <span className="text-muted-foreground/30">/</span>
            <span className="text-xs font-semibold text-primary">{badge}</span>
          </div>
          <h2 className="text-xl font-bold text-foreground" style={{ fontFamily: "'Inter', sans-serif" }}>{title}</h2>
          <p className="text-sm text-muted-foreground mt-0.5">{subtitle}</p>
        </div>
        <div className="text-right flex-shrink-0 ml-6">
          <div className="text-xs text-muted-foreground mb-1.5" style={{ fontFamily: "'DM Mono', monospace" }}>
            {current + 1} / {steps.length}
          </div>
          <div className="w-20 h-1.5 bg-border rounded-full overflow-hidden">
            <div className="h-full bg-primary rounded-full transition-all duration-500" style={{ width: `${progress}%` }}/>
          </div>
        </div>
      </div>
      <Stepper steps={steps} current={current}/>
      <div className="bg-card border border-border rounded-2xl p-6 shadow-sm">
        {children}
        <div className="flex items-center justify-between pt-5 mt-3 border-t border-border">
          <button onClick={onBack} disabled={current === 0}
            className="flex items-center gap-1.5 px-4 py-2.5 rounded-xl border border-border text-sm font-medium text-muted-foreground hover:text-foreground hover:border-foreground/20 disabled:opacity-25 disabled:cursor-not-allowed transition-all">
            <ChevronLeft size={14}/> Voltar
          </button>
          <span className="text-xs text-muted-foreground hidden sm:block">{steps[current].label}</span>
          {isLast ? (
            <button onClick={onSubmit}
              className="flex items-center gap-2 bg-[#04B9CD] hover:bg-[#03a3b5] active:scale-95 text-[#0d1e2e] font-bold px-6 py-2.5 rounded-xl text-sm transition-all shadow-sm shadow-[#04B9CD]/25">
              <Check size={14}/> Finalizar
            </button>
          ) : (
            <button onClick={onNext}
              className="flex items-center gap-2 bg-[#04B9CD] hover:bg-[#03a3b5] active:scale-95 text-[#0d1e2e] font-semibold px-5 py-2.5 rounded-xl text-sm transition-all">
              Continuar <ChevronRight size={14}/>
            </button>
          )}
        </div>
      </div>
    </div>
  );
}

// ── Review primitives ────────────────────────────────────────────────────────

interface EquipeItem { id: number; nome: string; lider: string }
type MinData = { nome: string; emoji: string; cor: string; descricao: string; lider: string; viceLider: string; equipes: EquipeItem[] };
const minInit: MinData = { nome:"", emoji:"✝️", cor:"#8b5cf6", descricao:"", lider:"", viceLider:"", equipes:[] };

function JornadaMinisterio({ onDone, onCancel }: { onDone: (n: string) => void; onCancel: () => void }) {
  const [step, setStep] = useState(0);
  const [d, setD] = useState<MinData>(minInit);
  const [errs, setErrs] = useState<Partial<Record<keyof MinData, string>>>({});
  const [done, setDone] = useState(false);
  const [newEq, setNewEq] = useState({ nome:"", lider:"" });

  const set = <K extends keyof MinData>(k: K, v: MinData[K]) => { setD(p => ({ ...p, [k]: v })); setErrs(p => ({ ...p, [k]: "" })); };

  const validate = () => {
    const e: Partial<Record<keyof MinData, string>> = {};
    if (step === 0 && !d.nome.trim()) e.nome = "Nome é obrigatório";
    if (step === 1 && !d.lider) e.lider = "Líder é obrigatório";
    setErrs(e); return !Object.keys(e).length;
  };

  const addEquipe = () => {
    if (newEq.nome.trim()) { set("equipes", [...d.equipes, { id: Date.now(), ...newEq }]); setNewEq({ nome:"", lider:"" }); }
