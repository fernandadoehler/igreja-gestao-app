function defaultCategoryFor(index: number, total: number): string {
  if (index === 0) return "not_started";
  if (index === total - 1) return "done";
  return "active";
}
const ACTIVE_PALETTE = ["blue", "violet", "teal", "amber", "pink", "orange"];
function defaultColorKeyFor(category: string, index: number): string {
  if (category === "not_started") return "gray";
  if (category === "done") return "emerald";
  return ACTIVE_PALETTE[index % ACTIVE_PALETTE.length];
}
function stageCategoryFor(stage: any, index: number, total: number): string {
  return stage.category || defaultCategoryFor(index, total);
}
function stageColorFor(stage: any, index: number, total: number) {
  const cat = stageCategoryFor(stage, index, total);
  const key = stage.color || defaultColorKeyFor(cat, index);
  return STATUS_COLORS.find((c) => c.key === key) || STATUS_COLORS[0];
}
function StatusIcon({ category, size = 13, className }: any) {
  const def = STATUS_CATEGORIES.find((c) => c.key === category) || STATUS_CATEGORIES[0];
  const Icon = def.icon;
  return <Icon size={size} className={className} fill={category === "active" ? "currentColor" : "none"} strokeWidth={category === "not_started" ? 2 : 2} />;
}
function StagePopover({ stage, category, colorKey, onRename, onPickCategory, onPickColor, onConfig, onClose }: any) {
  const [name, setName] = useState(stage.name);
  const ref = useRef(null);
  useOutside(ref, onClose);
  const commit = () => { const v = name.trim(); if (v && v !== stage.name) onRename(v); };
  return (
    <div ref={ref} className="absolute left-0 top-9 rounded-xl border border-border bg-card p-3 shadow-xl" style={{ zIndex: 50, width: 264 }} onClick={(e) => e.stopPropagation()}>
      <input autoFocus value={name} onChange={(e) => setName(e.target.value)}
        onBlur={commit} onKeyDown={(e) => { if (e.key === "Enter") { commit(); onClose(); } }}

      <div className="mt-3">

const isFilled = (field, v) => {
  if (v === null || v === undefined) return false;
  if (!field) return false;
  if (field.type === "address") return !!(v.cep && v.logradouro && v.numero);
  if (field.type === "file") return !!(v && v.name);
  if (Array.isArray(v)) return v.length > 0;
  if (typeof v === "boolean") return true;
  return String(v).trim() !== "";
};

const displayValue = (field, v, users) => {
  if (!field || !isFilled(field, v)) return "";
  switch (field.type) {
    case "currency": return fmtMoney(v);
    case "date": case "deadline": return fmtDate(v);
    case "datetime": return String(v).replace("T", " ").slice(0, 16).split(" ").map((p, i) => (i === 0 ? fmtDate(p) : p)).join(" ");
    case "boolean": return v ? "Sim" : "Não";
    case "user": return (users.find((u) => u.id === v) || {}).name || "";
    case "users": return v.map((id) => (users.find((u) => u.id === id) || {}).name).filter(Boolean).join(", ");
    case "labels": return v.map((id) => (LABELS.find((l) => l.id === id) || {}).name).filter(Boolean).join(", ");
    case "multi": return v.join(", ");
    case "file": return v.name;
    case "address": return `${v.logradouro}, ${v.numero} — ${v.bairro}, ${v.cidade}/${v.estado}`;
    default: return String(v);
  }
};

function buildCard(cfg) {
  const board = SEED_BOARDS.find((b) => b.id === cfg.boardId);
  const sIdx = cfg.stageIdx;
  const stage = board.stages[sIdx];
  const carry = cfg.carry || 0;
  const entries = [];
  const push = (fieldId, required, stageId) => {
    if (entries.some((e) => e.fieldId === fieldId)) return;
    entries.push({ id: uid("ent"), fieldId, required, origin: stageId ? "stage" : "card", stageId: stageId || null });
  };
  for (let i = Math.max(0, sIdx - carry); i <= sIdx; i++) {
    board.stages[i].fields.filter((f) => f.required).forEach((f) => push(f.fieldId, true, board.stages[i].id));
  }
  Object.keys(cfg.values || {}).forEach((fid) => {
    if (entries.some((e) => e.fieldId === fid)) return;
    let found = null;
    for (let i = Math.max(0, sIdx - carry); i <= sIdx; i++) {
      const f = board.stages[i].fields.find((x) => x.fieldId === fid);
      if (f) { found = { stageId: board.stages[i].id, required: f.required }; break; }
    }
    if (found) push(fid, found.required, found.stageId);
    else push(fid, false, null);
  });
  (cfg.extra || []).forEach((fid) => push(fid, false, null));
  const created = Date.now() - (cfg.ageDays || 4) * DAY;
  return {
    id: uid("card"), code: cfg.code, boardId: cfg.boardId, stageId: stage.id,
    title: cfg.title, description: cfg.description || "",
    assignees: cfg.assignees || [], due: cfg.due || null, labels: cfg.labels || [],
    fields: entries, values: cfg.values || {},
    checklists: cfg.checklists || [], subtasks: cfg.subtasks || [],
    comments: cfg.comments || [], attachments: cfg.attachments || [],
    history: cfg.history || [{ id: uid("h"), at: created, userId: cfg.createdBy || "u1", text: "Card criado" }],
    createdBy: cfg.createdBy || "u1", createdAt: created,
  };
}

/* ==========================================================================

function useOutside(ref, cb) {
  useEffect(() => {
    const h = (e) => { if (ref.current && !ref.current.contains(e.target)) cb(); };
    document.addEventListener("mousedown", h);
    return () => document.removeEventListener("mousedown", h);
  }, [ref, cb]);
}

function Btn({ variant = "default", size = "md", icon: Icon, children, className, ...p }: any) {
  const variants = {
    default: "bg-card text-foreground border border-border hover:bg-muted/50 hover:border-border",
    primary: "bg-[#04B9CD] text-[#0d1e2e] hover:bg-[#03a3b5] shadow-sm font-semibold",
    ghost: "text-muted-foreground hover:bg-muted",
    danger: "bg-card text-red-500 border border-red-400/30 hover:bg-red-500/10",
    subtle: "bg-muted text-foreground hover:bg-muted/70",
    dark: "bg-foreground text-background hover:opacity-90",
  };
  const sizes = { xs: "h-7 px-2 text-xs", sm: "h-8 px-2.5 text-xs", md: "h-9 px-3 text-sm", lg: "h-10 px-4 text-sm", icon: "h-8 w-8", iconsm: "h-7 w-7" };
  return (
    <button
      className={cx("inline-flex items-center justify-center gap-1.5 rounded-lg font-medium transition-colors disabled:opacity-40 disabled:pointer-events-none", variants[variant], sizes[size], className)}
      {...p}
    >
      {Icon && <Icon size={size === "xs" || size === "sm" || size === "iconsm" ? 14 : 16} strokeWidth={2} />}
      {children}
    </button>
  );
}

function Avatar({ user, size = 24 }: any) {
  if (!user) return <div className="rounded-full border border-dashed border-slate-300" style={{ width: size, height: size }} />;
  return (
    <div className={cx("flex items-center justify-center rounded-full font-semibold text-white ring-2 ring-white", user.color)}
      style={{ width: size, height: size, fontSize: Math.max(9, Math.round(size * 0.38)) }} title={user.name}>
      {user.initials}
    </div>
  );
}

function Chip({ tone = "slate", children, className }: any) {
  return <span className={cx("inline-flex items-center gap-1 rounded-md border px-1.5 py-0.5 text-xs font-medium", TONE[tone], className)}>{children}</span>;
}

function DropdownMenu({ items, align = "right", width = 210, children, zIndex = 60 }: any) {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  useOutside(ref, () => setOpen(false));
  return (
    <div className="relative" ref={ref}>
      <div onClick={(e) => { e.stopPropagation(); setOpen((o) => !o); }}>{children}</div>
      {open && (
        <div className={cx("absolute mt-1 rounded-xl border border-border bg-card p-1 shadow-lg", align === "right" ? "right-0" : "left-0")} style={{ width, zIndex }}>
          {items.filter(Boolean).map((it, i) =>
            it.sep ? <div key={i} className="my-1 h-px bg-border" /> : (
              <button key={i} onClick={(e) => { e.stopPropagation(); setOpen(false); it.onClick && it.onClick(); }}
                className={cx("flex w-full items-center gap-2 rounded-lg px-2.5 py-2 text-left text-sm transition-colors", it.danger ? "text-red-500 hover:bg-red-500/10" : "text-foreground hover:bg-muted")}>
                {it.icon && <it.icon size={15} />}<span className="truncate">{it.label}</span>
              </button>
            )
          )}
        </div>
      )}
    </div>
  );
}

function Modal({ open, onClose, title, subtitle, children, footer, width = 560, zIndex = 70 }: any) {
  useEffect(() => {
    if (!open) return;
    const h = (e) => e.key === "Escape" && onClose();
    window.addEventListener("keydown", h);
    return () => window.removeEventListener("keydown", h);
  }, [open, onClose]);
  if (!open) return null;
  return (
    <div className="fixed inset-0 flex items-start justify-center overflow-y-auto bg-black bg-opacity-65 backdrop-blur-sm p-4 sm:p-8" style={{ zIndex }} onMouseDown={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="my-auto w-full rounded-2xl border border-border bg-card shadow-2xl" style={{ maxWidth: width }} onMouseDown={(e) => e.stopPropagation()}>
        <div className="flex items-start justify-between gap-4 border-b border-border px-5 py-4">
          <div>
            <h3 className="text-base font-semibold text-foreground">{title}</h3>
            {subtitle && <p className="mt-0.5 text-sm text-muted-foreground">{subtitle}</p>}
          </div>
          <Btn variant="ghost" size="icon" onClick={onClose} aria-label="Fechar"><X size={16} /></Btn>
        </div>
        <div className="max-h-screen overflow-y-auto px-5 py-4">{children}</div>
        {footer && <div className="flex items-center justify-end gap-2 border-t border-border bg-muted/30 px-5 py-3 rounded-b-2xl">{footer}</div>}
      </div>
    </div>
  );
}

function Field({ label, hint, children, className }: any) {
  return (
    <label className={cx("block", className)}>
      <span className="mb-1.5 block text-xs font-medium text-muted-foreground">{label}</span>
      {children}
      {hint && <span className="mt-1 block text-xs text-muted-foreground/70">{hint}</span>}
    </label>
  );
}

function ToggleRow({ checked, onChange, label, desc }: any) {
  return (
    <button type="button" onClick={() => onChange(!checked)} className="flex w-full items-start gap-2.5 rounded-lg px-1 py-1.5 text-left hover:bg-muted/50">
      <span className={cx("mt-0.5 flex h-4 w-4 flex-none items-center justify-center rounded border transition-colors", checked ? "border-[#04B9CD] bg-[#04B9CD] text-[#0d1e2e]" : "border-border bg-card")}>
        {checked && <Check size={12} strokeWidth={3} />}
      </span>
      <span>
        <span className="block text-sm text-foreground">{label}</span>
        {desc && <span className="block text-xs text-muted-foreground">{desc}</span>}
      </span>
    </button>
  );
}

function SwitchToggle({ checked, onChange }: any) {
  return (
    <button type="button" onClick={() => onChange(!checked)} className={cx("relative h-5 w-9 flex-none rounded-full transition-colors", checked ? "bg-[#04B9CD]" : "bg-muted")}>
      <span className="absolute top-0.5 h-4 w-4 rounded-full bg-white shadow transition-all" style={{ left: checked ? 18 : 2 }} />
    </button>
  );
}

function Empty({ icon: Icon = Inbox, title, children }: any) {
  return (
    <div className="flex flex-col items-center justify-center rounded-xl border border-dashed border-border px-6 py-10 text-center">
      <Icon size={22} className="text-muted-foreground/50" />
      <p className="mt-2 text-sm font-medium text-foreground">{title}</p>
      {children && <p className="mt-1 max-w-sm text-xs text-muted-foreground">{children}</p>}
    </div>

}

function SectionTitle({ children, right }: any) {
  return (
    <div className="mb-2 flex items-center justify-between">
      <h4 className="text-xs font-semibold uppercase tracking-wide text-muted-foreground">{children}</h4>

/* ==========================================================================
   Editores de valor por tipo de campo
   ========================================================================== */

function AddressInput({ value, onChange, disabled }: any) {
  const v = value || { cep: "", logradouro: "", numero: "", complemento: "", bairro: "", cidade: "", estado: "" };
  const [loading, setLoading] = useState(false);
  const [msg, setMsg] = useState("");
  const set = (k, val) => onChange({ ...v, [k]: val });
  const buscar = () => {
    setLoading(true); setMsg("");
    setTimeout(() => {
      const found = CEP_DB[maskCEP(v.cep)];
      onChange({ ...v, cep: maskCEP(v.cep), ...(found || CEP_FALLBACK) });
      setLoading(false);
      setMsg(found ? "Endereço encontrado. Os dados podem ser editados abaixo." : "CEP não localizado na base. Preenchemos uma sugestão — edite se necessário.");
    }, 700);
  };
  return (
    <div className="rounded-xl border border-border bg-muted/30 p-3">
      <div className="flex items-end gap-2">
        <div className="w-40">
          <span className="mb-1.5 block text-xs font-medium text-muted-foreground">CEP</span>
          <input className={inp()} value={v.cep} disabled={disabled} placeholder="45000-000"
            onChange={(e) => set("cep", maskCEP(e.target.value))} onKeyDown={(e) => e.key === "Enter" && buscar()} />
        </div>
        <Btn onClick={buscar} disabled={disabled || digits(v.cep).length < 8 || loading} icon={loading ? Loader2 : Search}>
          {loading ? "Buscando..." : "Buscar CEP"}
        </Btn>
      </div>
      {msg && <p className="mt-2 text-xs text-emerald-600">{msg}</p>}
      <div className="mt-3 grid grid-cols-6 gap-2">
        <div className="col-span-4"><Field label="Logradouro"><input className={inp()} value={v.logradouro} disabled={disabled} onChange={(e) => set("logradouro", e.target.value)} /></Field></div>
        <div className="col-span-2"><Field label="Número"><input className={inp()} value={v.numero} disabled={disabled} onChange={(e) => set("numero", e.target.value)} /></Field></div>
        <div className="col-span-3"><Field label="Complemento"><input className={inp()} value={v.complemento} disabled={disabled} onChange={(e) => set("complemento", e.target.value)} /></Field></div>
        <div className="col-span-3"><Field label="Bairro"><input className={inp()} value={v.bairro} disabled={disabled} onChange={(e) => set("bairro", e.target.value)} /></Field></div>
        <div className="col-span-4"><Field label="Cidade"><input className={inp()} value={v.cidade} disabled={disabled} onChange={(e) => set("cidade", e.target.value)} /></Field></div>
        <div className="col-span-2"><Field label="Estado"><input className={inp()} value={v.estado} disabled={disabled} maxLength={2} onChange={(e) => set("estado", e.target.value.toUpperCase())} /></Field></div>
      </div>
    </div>
  );
}

function PillGroup({ options, value, onChange, multiple, disabled }: any) {
  const arr = multiple ? value || [] : [];
  const toggle = (o) => {
    if (disabled) return;
    if (multiple) onChange(arr.includes(o) ? arr.filter((x) => x !== o) : [...arr, o]);
    else onChange(value === o ? null : o);
  };
  return (
    <div className="flex flex-wrap gap-1.5">
      {options.map((o) => {
        const active = multiple ? arr.includes(o) : value === o;
        return (
          <button key={o} type="button" onClick={() => toggle(o)}
            className={cx("rounded-full border px-2.5 py-1 text-xs font-medium transition-colors",
              active ? "border-[#04B9CD]/40 bg-[#04B9CD]/15 text-primary" : "border-border bg-card text-muted-foreground hover:border-[#04B9CD]/30")}>
            {o}
          </button>
        );
      })}
    </div>
  );
}

function ValueInput({ field, value, onChange, disabled }: any) {
  const { state } = useApp();
  const users = state.users;
  const t = field.type;
  const set = (v) => onChange(v);

  if (t === "textarea") return <textarea rows={3} className={inp()} value={value || ""} disabled={disabled} onChange={(e) => set(e.target.value)} placeholder="Escreva aqui..." />;
  if (t === "number") return <input type="number" className={inp()} value={value ?? ""} disabled={disabled} onChange={(e) => set(e.target.value === "" ? null : Number(e.target.value))} />;
  if (t === "currency")
    return (
      <div className="relative">
        <span className="pointer-events-none absolute left-3 top-2 text-sm text-muted-foreground">R$</span>
        <input type="number" step="0.01" className={cx(inp(), "pl-9")} value={value ?? ""} disabled={disabled} onChange={(e) => set(e.target.value === "" ? null : Number(e.target.value))} />
      </div>
    );
  if (t === "date" || t === "deadline") return <input type="date" className={inp()} value={value || ""} disabled={disabled} onChange={(e) => set(e.target.value)} />;
  if (t === "time") return <input type="time" className={inp()} value={value || ""} disabled={disabled} onChange={(e) => set(e.target.value)} />;
  if (t === "datetime") return <input type="datetime-local" className={inp()} value={value || ""} disabled={disabled} onChange={(e) => set(e.target.value)} />;
  if (t === "boolean")
    return (
      <div className="flex gap-1.5">
        {([["Sim", true], ["Não", false]] as [string, boolean][]).map(([lbl, val]) => (
          <button key={String(lbl)} type="button" disabled={disabled} onClick={() => set(value === val ? null : val)}
            className={cx("rounded-lg border px-3 py-1.5 text-xs font-medium transition-colors",
              value === val ? "border-[#04B9CD]/40 bg-[#04B9CD]/15 text-primary" : "border-border bg-card text-muted-foreground hover:border-[#04B9CD]/30")}>
            {lbl}
          </button>
        ))}
      </div>
    );
  if (t === "dropdown")
    return (
      <select className={inp()} value={value || ""} disabled={disabled} onChange={(e) => set(e.target.value || null)}>
        <option value="">Selecione...</option>
        {(field.options || []).map((o) => <option key={o} value={o}>{o}</option>)}
      </select>
    );
  if (t === "single") return <PillGroup options={field.options || []} value={value} onChange={set} disabled={disabled} />;
  if (t === "multi") return <PillGroup options={field.options || []} value={value} onChange={set} multiple disabled={disabled} />;
  if (t === "labels")
    return (
      <div className="flex flex-wrap gap-1.5">
        {LABELS.map((l) => {
          const active = (value || []).includes(l.id);
          return (
            <button key={l.id} type="button" disabled={disabled}
              onClick={() => set(active ? (value || []).filter((x) => x !== l.id) : [...(value || []), l.id])}
              className={cx("rounded-md border px-2 py-0.5 text-xs font-medium transition-opacity", TONE[l.tone], active ? "opacity-100" : "opacity-40 hover:opacity-70")}>
              {l.name}
            </button>
          );
        })}
      </div>
    );
  if (t === "user")
    return (
      <select className={inp()} value={value || ""} disabled={disabled} onChange={(e) => set(e.target.value || null)}>
        <option value="">Sem responsável</option>
        {users.map((u) => <option key={u.id} value={u.id}>{u.name}</option>)}
      </select>
    );
  if (t === "users")
    return (
      <div className="flex flex-wrap gap-1.5">
        {users.map((u) => {
          const active = (value || []).includes(u.id);
          return (
            <button key={u.id} type="button" disabled={disabled}
              onClick={() => set(active ? (value || []).filter((x) => x !== u.id) : [...(value || []), u.id])}
              className={cx("flex items-center gap-1.5 rounded-full border py-0.5 pl-0.5 pr-2.5 text-xs font-medium transition-colors",
                active ? "border-[#04B9CD]/40 bg-[#04B9CD]/15 text-primary" : "border-border bg-card text-muted-foreground hover:border-[#04B9CD]/30")}>
              <Avatar user={u} size={20} />{u.name.split(" ")[0]}
            </button>
          );
        })}
      </div>
    );
  if (t === "file") {
    const f = value;
    return f ? (
      <div className="flex items-center justify-between rounded-lg border border-border bg-card px-3 py-2">
        <span className="flex items-center gap-2 text-sm text-foreground"><Paperclip size={14} className="text-muted-foreground" />{f.name}<span className="text-xs text-muted-foreground">{f.size}</span></span>
        {!disabled && <Btn variant="ghost" size="iconsm" onClick={() => set(null)}><X size={14} /></Btn>}
      </div>
    ) : (
      <Btn icon={Paperclip} disabled={disabled} onClick={() => set(MOCK_FILES[Math.floor(Math.random() * MOCK_FILES.length)])}>Selecionar arquivo</Btn>
    );
  }
  if (t === "link_card") {
    const cards = state.cards;
    return (
      <select className={inp()} value={value || ""} disabled={disabled} onChange={(e) => set(e.target.value || null)}>
        <option value="">Nenhum card relacionado</option>
        {cards.map((c) => <option key={c.id} value={c.id}>{c.code} — {c.title}</option>)}
      </select>
    );
  }
  if (t === "link_record")
    return (
      <select className={inp()} value={value || ""} disabled={disabled} onChange={(e) => set(e.target.value || null)}>
        <option value="">Nenhum registro relacionado</option>
        {MOCK_RECORDS.map((r) => <option key={r} value={r}>{r}</option>)}
      </select>
    );
  if (t === "address") return <AddressInput value={value} onChange={set} disabled={disabled} />;

  const masks = { cpf: maskCPF, cnpj: maskCNPJ, phone: maskPhone };
  const mask = masks[t];
  const placeholders = { cpf: "000.000.000-00", cnpj: "00.000.000/0000-00", phone: "(00) 00000-0000", email: "nome@empresa.com.br", url: "https://", docid: "Identificador" };
  return (
    <input className={inp()} value={value || ""} disabled={disabled} placeholder={placeholders[t] || ""}
      onChange={(e) => set(mask ? mask(e.target.value) : e.target.value)} />
  );
}

/* ==========================================================================
   Seletor de campo (busca na biblioteca antes de criar)
   ========================================================================== */

function FieldPicker({ open, onClose, onPick, excludeIds = [], zIndex = 80 }: any) {
  const { state, createField } = useApp();
  const [q, setQ] = useState("");
  const [mode, setMode] = useState("search");
  const [form, setForm] = useState({ name: "", type: "text", options: ["Opção 1", "Opção 2"] });

  useEffect(() => { if (open) { setQ(""); setMode("search"); setForm({ name: "", type: "text", options: ["Opção 1", "Opção 2"] }); } }, [open]);

  const norm = (s) => s.toLowerCase().trim();
  const results = state.fields.filter((f) => !excludeIds.includes(f.id) && (!q || norm(f.name).includes(norm(q))));
  const exact = q && state.fields.find((f) => norm(f.name) === norm(q));

  const startCreate = () => { setForm((f) => ({ ...f, name: q })); setMode("create"); };
  const submitCreate = () => {
    if (!form.name.trim()) return;
    const id = createField({ name: form.name.trim(), type: form.type, options: OPTION_TYPES.includes(form.type) ? form.options.filter((o) => o.trim()) : null });
    onPick(id);
    onClose();
  };

  return (
    <Modal open={open} onClose={onClose} zIndex={zIndex} width={620}
      title={mode === "search" ? "Adicionar campo" : "Criar novo campo"}
      subtitle={mode === "search" ? "Procure primeiro na biblioteca — reutilizar mantém os dados padronizados." : "Este campo passa a ficar disponível na biblioteca para todas as trilhas."}
      footer={mode === "create" ? (
        <>
          <Btn onClick={() => setMode("search")}>Voltar</Btn>
          <Btn variant="primary" onClick={submitCreate} disabled={!form.name.trim()}>Criar campo</Btn>
        </>
      ) : null}>
      {mode === "search" ? (
        <div>
          <div className="relative">
            <Search size={15} className="absolute left-3 top-2.5 text-muted-foreground" />
            <input autoFocus className={cx(inp(), "pl-9")} placeholder="Pesquisar na biblioteca de campos..." value={q} onChange={(e) => setQ(e.target.value)} />
          </div>

          {exact && (
            <div className="mt-3 flex items-center justify-between rounded-xl border border-emerald-200 bg-emerald-50 px-3 py-2.5">
              <div>
                <p className="text-xs font-semibold text-emerald-800">Campo existente encontrado</p>
                <p className="text-sm text-emerald-700">{exact.name} — tipo {TYPE[exact.type].label}</p>
              </div>
              <Btn variant="primary" size="sm" onClick={() => { onPick(exact.id); onClose(); }}>Usar campo existente</Btn>
            </div>
          )}

          <div className="mt-3 max-h-72 space-y-1 overflow-y-auto pr-1">
            {results.length === 0 && <p className="px-1 py-6 text-center text-sm text-muted-foreground">Nenhum campo da biblioteca corresponde a "{q}".</p>}
            {results.map((f) => {
              const Icon = TYPE[f.type].icon;
              return (
                <button key={f.id} onClick={() => { onPick(f.id); onClose(); }}
                  className="flex w-full items-center gap-3 rounded-lg border border-transparent px-2.5 py-2 text-left hover:border-border hover:bg-muted/40">
                  <span className="flex h-7 w-7 flex-none items-center justify-center rounded-lg bg-muted text-muted-foreground"><Icon size={14} /></span>
                  <span className="min-w-0 flex-1">
                    <span className="block truncate text-sm font-medium text-foreground">{f.name}</span>
                    <span className="block text-xs text-muted-foreground">{TYPE[f.type].label}</span>
                  </span>
                  <Plus size={15} className="text-muted-foreground" />
                </button>
              );
            })}
          </div>

          <div className="mt-3 flex items-center justify-between rounded-xl bg-muted/30 px-3 py-2.5">
            <p className="text-xs text-muted-foreground">Não encontrou o que precisa?</p>
            <Btn size="sm" icon={Plus} onClick={startCreate}>{q ? "Criar novo campo mesmo assim" : "Criar novo campo"}</Btn>
          </div>
        </div>
      ) : (
        <div className="space-y-4">
          <Field label="Nome do campo"><input autoFocus className={inp()} value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} placeholder="Ex.: Número do protocolo externo" /></Field>
          <Field label="Tipo do campo">
            <select className={inp()} value={form.type} onChange={(e) => setForm({ ...form, type: e.target.value })}>
              {TYPE_GROUPS.map((g) => (
                <optgroup key={g} label={g}>
                  {FIELD_TYPES.filter((t) => t.group === g).map((t) => <option key={t.id} value={t.id}>{t.label}</option>)}
                </optgroup>
              ))}
            </select>
          </Field>
          {OPTION_TYPES.includes(form.type) && (
            <Field label="Opções">
              <div className="space-y-1.5">
                {form.options.map((o, i) => (
                  <div key={i} className="flex gap-1.5">
                    <input className={inp()} value={o} onChange={(e) => { const opts = [...form.options]; opts[i] = e.target.value; setForm({ ...form, options: opts }); }} />
                    <Btn variant="ghost" size="icon" onClick={() => setForm({ ...form, options: form.options.filter((_, j) => j !== i) })}><X size={14} /></Btn>
                  </div>
                ))}
                <Btn size="sm" icon={Plus} onClick={() => setForm({ ...form, options: [...form.options, ""] })}>Adicionar opção</Btn>
              </div>
            </Field>
          )}
        </div>
      )}
    </Modal>
  );
}

/* ==========================================================================
   Configuração da etapa
   ========================================================================== */

function StageConfigModal({ open, board, stage, onClose }: any) {
  const { state, setState, toast, fieldById } = useApp();
  const [picker, setPicker] = useState(false);
  const [tplPicker, setTplPicker] = useState(false);
  if (!open || !stage) return null;

  const mutate = (fn) =>
    setState((s) => ({
      ...s,
      boards: s.boards.map((b) => b.id !== board.id ? b : { ...b, stages: b.stages.map((st) => (st.id !== stage.id ? st : fn(st))) }),
    }));

  const rename = (name) => mutate((st) => ({ ...st, name }));
  const addField = (fieldId) => {
    if (stage.fields.some((f) => f.fieldId === fieldId)) { toast("Esse campo já está na etapa."); return; }
    mutate((st) => ({ ...st, fields: [...st.fields, { fieldId, required: false }] }));
    toast(`Campo "${fieldById(fieldId).name}" adicionado à etapa.`);
  };
  const removeField = (fieldId) => mutate((st) => ({ ...st, fields: st.fields.filter((f) => f.fieldId !== fieldId) }));
  const setRequired = (fieldId, required) => mutate((st) => ({ ...st, fields: st.fields.map((f) => (f.fieldId === fieldId ? { ...f, required } : f)) }));
  const move = (i, dir) => mutate((st) => {
    const arr = [...st.fields]; const j = i + dir;
    if (j < 0 || j >= arr.length) return st;
    [arr[i], arr[j]] = [arr[j], arr[i]];
    return { ...st, fields: arr };
  });
  const applyTemplate = (tpl) => {
    mutate((st) => {
      const add = tpl.fieldIds.filter((fid) => !st.fields.some((f) => f.fieldId === fid)).map((fid) => ({ fieldId: fid, required: false }));
      return { ...st, fields: [...st.fields, ...add] };
    });
    toast(`Template "${tpl.name}" aplicado à etapa ${stage.name}.`);
  };

  const req = stage.fields.filter((f) => f.required).length;

  return (
    <>
      <Modal open={open} onClose={onClose} width={720}
        title={`Configurações da etapa — ${stage.name}`}
        subtitle={`${stage.fields.length} campos · ${req} obrigatórios · ${stage.fields.length - req} opcionais`}
        footer={<Btn variant="primary" onClick={onClose}>Concluir</Btn>}>
        <div className="space-y-5">
          <Field label="Nome da etapa"><input className={inp()} value={stage.name} onChange={(e) => rename(e.target.value)} /></Field>

          <div className="grid grid-cols-2 gap-3">
            <div className="rounded-xl border border-amber-200 bg-amber-50 p-3">
              <p className="text-xs font-semibold text-amber-800">Campo obrigatório</p>
              <p className="mt-0.5 text-xs text-amber-700">Aparece automaticamente no card quando ele entra na etapa e precisa ser preenchido antes de avançar.</p>
            </div>
            <div className="rounded-xl border border-border bg-muted/30 p-3">
              <p className="text-xs font-semibold text-foreground">Campo opcional</p>
              <p className="mt-0.5 text-xs text-muted-foreground">Fica disponível para aplicação — ao entrar na etapa o usuário decide se quer usá-lo.</p>
            </div>
          </div>

          <div>
            <SectionTitle right={
              <div className="flex gap-1.5">
                <Btn size="sm" icon={LayoutTemplate} onClick={() => setTplPicker(true)}>Aplicar template</Btn>
                <Btn size="sm" variant="primary" icon={Plus} onClick={() => setPicker(true)}>Adicionar campo</Btn>
              </div>
            }>Campos desta etapa</SectionTitle>

            {stage.fields.length === 0 ? (
              <Empty icon={Layers} title="Nenhum campo configurado">Cards que entrarem nesta etapa não receberão campos automaticamente.</Empty>
            ) : (
              <div className="space-y-1.5">
                {stage.fields.map((f, i) => {
                  const fld = fieldById(f.fieldId);
                  if (!fld) return null;
                  const Icon = TYPE[fld.type].icon;
                  return (
                    <div key={f.fieldId} className="flex items-center gap-2 rounded-xl border border-border bg-card px-2.5 py-2">
                      <div className="flex flex-col">
                        <button className="text-muted-foreground/40 hover:text-foreground disabled:opacity-30" disabled={i === 0} onClick={() => move(i, -1)}><ArrowUp size={12} /></button>
                        <button className="text-muted-foreground/40 hover:text-foreground disabled:opacity-30" disabled={i === stage.fields.length - 1} onClick={() => move(i, 1)}><ArrowDown size={12} /></button>
                      </div>
                      <span className="flex h-7 w-7 flex-none items-center justify-center rounded-lg bg-muted text-muted-foreground"><Icon size={14} /></span>
                      <div className="min-w-0 flex-1">
                        <p className="truncate text-sm font-medium text-foreground">{fld.name}</p>
                        <p className="text-xs text-muted-foreground">{TYPE[fld.type].label}</p>
                      </div>
                      <div className="flex rounded-lg bg-muted p-0.5">
                        <button onClick={() => setRequired(f.fieldId, true)} className={cx("rounded-md px-2.5 py-1 text-xs font-medium transition-colors", f.required ? "bg-card text-amber-700 shadow-sm" : "text-muted-foreground")}>Obrigatório</button>
                        <button onClick={() => setRequired(f.fieldId, false)} className={cx("rounded-md px-2.5 py-1 text-xs font-medium transition-colors", !f.required ? "bg-card text-foreground shadow-sm" : "text-muted-foreground")}>Opcional</button>
                      </div>
                      <Btn variant="ghost" size="iconsm" onClick={() => removeField(f.fieldId)}><Trash2 size={14} /></Btn>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        </div>
      </Modal>
      <FieldPicker open={picker} onClose={() => setPicker(false)} onPick={addField} excludeIds={stage.fields.map((f) => f.fieldId)} />
      <TemplatePicker open={tplPicker} onClose={() => setTplPicker(false)} onPick={applyTemplate} title="Aplicar template à etapa" />
    </>
  );
}

   Card aberto

function FieldRow({ card, entry, highlight, canEdit, onRemove }: any) {
  const { fieldById, setValue, renameCardField } = useApp();
  const fld = fieldById(entry.fieldId);
  const [editingLabel, setEditingLabel] = useState(false);
  const [labelDraft, setLabelDraft] = useState("");
  if (!fld) return null;
  const Icon = TYPE[fld.type].icon;
  const filled = isFilled(fld, card.values[entry.fieldId]);
  const displayLabel = entry.label || fld.name;
  const isCustom = !!entry.label && entry.label !== fld.name;

  const startEdit = () => { setLabelDraft(displayLabel); setEditingLabel(true); };
  const commitLabel = () => { renameCardField(card.id, entry.id, labelDraft); setEditingLabel(false); };

  return (
    <div className={cx("rounded-xl border bg-card p-3 transition-shadow", highlight ? "border-amber-300 ring-2 ring-amber-100" : "border-border")}>
      <div className="mb-2 flex items-center gap-2">
        <Icon size={14} className="flex-none text-muted-foreground" />
        {editingLabel ? (
          <input autoFocus className="min-w-0 flex-1 rounded border border-[#04B9CD]/40 bg-transparent px-1.5 py-0.5 text-sm font-medium text-foreground outline-none"
            value={labelDraft} onChange={(e) => setLabelDraft(e.target.value)}
            onBlur={commitLabel} onKeyDown={(e) => { if (e.key === "Enter") commitLabel(); if (e.key === "Escape") setEditingLabel(false); }} />
        ) : (
          <span className="flex min-w-0 items-center gap-1.5">
            <span className="truncate text-sm font-medium text-foreground">{displayLabel}</span>
            {isCustom && <span className="flex-none text-xs text-muted-foreground/70" title={`Campo da biblioteca: ${fld.name}`}>({fld.name})</span>}
          </span>
        )}
        {canEdit && !editingLabel && (
          <button onClick={startEdit} className="flex-none text-muted-foreground/50 hover:text-foreground" title="Renomear campo neste card">
            <Pencil size={12} />
          </button>
        )}
        {entry.required ? (
          <span className="rounded border border-amber-200 bg-amber-50 px-1.5 py-0.5 text-xs font-medium text-amber-700">Obrigatório</span>
        ) : (
          <span className="rounded border border-border bg-muted/40 px-1.5 py-0.5 text-xs font-medium text-muted-foreground">Opcional</span>
        )}
        <span className="ml-auto flex items-center gap-1.5">
          {filled ? (
            <span className="flex items-center gap-1 text-xs font-medium text-emerald-600"><CheckCircle2 size={13} />Preenchido</span>
          ) : (
            <span className={cx("flex items-center gap-1 text-xs font-medium", entry.required ? "text-amber-600" : "text-muted-foreground")}><Circle size={13} />Pendente</span>
          )}
          {canEdit && onRemove && <button onClick={onRemove} className="text-muted-foreground/50 hover:text-red-500" title="Remover campo do card"><X size={14} /></button>}
        </span>
      </div>
      <ValueInput field={fld} value={card.values[entry.fieldId]} disabled={!canEdit} onChange={(v) => setValue(card.id, fld, v)} />
      {isCustom && !editingLabel && canEdit && (
        <button onClick={() => renameCardField(card.id, entry.id, "")} className="mt-1.5 text-xs text-muted-foreground hover:text-foreground hover:underline">
          Restaurar nome padrão da biblioteca
        </button>
      )}
    </div>
  );
}

function Checklists({ card, canEdit }: any) {
  const { updateCard, log } = useApp();
  const [novo, setNovo] = useState("");
  const [item, setItem] = useState({});
  const add = () => {
    if (!novo.trim()) return;
    updateCard(card.id, (c) => ({ ...c, checklists: [...c.checklists, { id: uid("cl"), title: novo.trim(), items: [] }] }));
    log(card.id, `Checklist "${novo.trim()}" criado`);
    setNovo("");
  };
  const addItem = (clId) => {
    const text = (item[clId] || "").trim();
    if (!text) return;
    const cl0 = card.checklists.find((x) => x.id === clId);
    updateCard(card.id, (c) => ({ ...c, checklists: c.checklists.map((cl) => (cl.id === clId ? { ...cl, items: [...cl.items, { id: uid("it"), text, done: false }] } : cl)) }));
    log(card.id, `Item "${text}" adicionado ao checklist "${cl0?.title}"`);
    setItem({ ...item, [clId]: "" });
  };
  const removeItem = (clId, itId) => {
    const cl0 = card.checklists.find((x) => x.id === clId);
    const it0 = cl0?.items.find((i) => i.id === itId);
    updateCard(card.id, (c) => ({ ...c, checklists: c.checklists.map((cl) => (cl.id === clId ? { ...cl, items: cl.items.filter((i) => i.id !== itId) } : cl)) }));
    log(card.id, `Item "${it0?.text}" removido do checklist "${cl0?.title}"`);
  };
  const removeChecklist = (clId) => {
    const cl0 = card.checklists.find((x) => x.id === clId);
    updateCard(card.id, (c) => ({ ...c, checklists: c.checklists.filter((x) => x.id !== clId) }));
    log(card.id, `Checklist "${cl0?.title}" excluído`);
  };
  const toggle = (clId, itId) => {
    updateCard(card.id, (c) => ({ ...c, checklists: c.checklists.map((cl) => (cl.id === clId ? { ...cl, items: cl.items.map((i) => (i.id === itId ? { ...i, done: !i.done } : i)) } : cl)) }));
    const cl = card.checklists.find((x) => x.id === clId);
    const it = cl?.items.find((i) => i.id === itId);
    log(card.id, `Item "${it?.text}" marcado como ${it?.done ? "não concluído" : "concluído"}`);
  };
  return (
    <div className="space-y-4">
      {card.checklists.map((cl) => {
        const done = cl.items.filter((i) => i.done).length;
        const pct = cl.items.length ? Math.round((done / cl.items.length) * 100) : 0;
        return (
          <div key={cl.id} className="rounded-xl border border-border bg-card p-3.5">
            <div className="flex items-center justify-between">
              <p className="text-sm font-semibold text-foreground">{cl.title}</p>
              <div className="flex items-center gap-2">
                <span className="text-xs text-muted-foreground">{done} de {cl.items.length} concluídos</span>
                {canEdit && <Btn variant="ghost" size="iconsm" onClick={() => removeChecklist(cl.id)}><Trash2 size={13} /></Btn>}
              </div>
            </div>
            <div className="mt-2 h-1.5 w-full overflow-hidden rounded-full bg-muted">
              <div className="h-full rounded-full bg-emerald-500 transition-all" style={{ width: pct + "%" }} />
            </div>
            <div className="mt-3 space-y-1">
              {cl.items.map((i) => (
                <div key={i.id} className="group flex items-center gap-1">
                  <button disabled={!canEdit} onClick={() => toggle(cl.id, i.id)} className="flex flex-1 min-w-0 items-center gap-2.5 rounded-lg px-1 py-1.5 text-left hover:bg-muted/40">
                    <span className={cx("flex h-4 w-4 flex-none items-center justify-center rounded border", i.done ? "border-emerald-500 bg-emerald-500 text-white" : "border-border")}>
                      {i.done && <Check size={11} strokeWidth={3} />}
                    </span>
                    <span className={cx("text-sm truncate", i.done ? "text-muted-foreground line-through" : "text-foreground")}>{i.text}</span>
                  </button>
                  {canEdit && (
                    <button onClick={() => removeItem(cl.id, i.id)} className="flex-none rounded p-1 text-muted-foreground opacity-0 transition-opacity hover:text-red-500 group-hover:opacity-100">
                      <X size={13} />
                    </button>
                  )}
                </div>
              ))}
            </div>
            {canEdit && (
              <div className="mt-2 flex gap-1.5">
                <input className={inp()} placeholder="Adicionar item..." value={item[cl.id] || ""} onChange={(e) => setItem({ ...item, [cl.id]: e.target.value })} onKeyDown={(e) => e.key === "Enter" && addItem(cl.id)} />
                <Btn onClick={() => addItem(cl.id)} icon={Plus}>Adicionar</Btn>
              </div>
            )}
          </div>
        );
      })}
      {canEdit && (
        <div className="flex gap-1.5">
          <input className={inp()} placeholder="Novo checklist (ex.: Preparação do atendimento)" value={novo} onChange={(e) => setNovo(e.target.value)} onKeyDown={(e) => e.key === "Enter" && add()} />
          <Btn variant="primary" onClick={add} icon={Plus}>Criar checklist</Btn>
        </div>
      )}
    </div>
  );
}

function Subtasks({ card, canEdit }: any) {
  const { state, updateCard, log } = useApp();
  const [t, setT] = useState("");
  const add = () => {
    if (!t.trim()) return;
    updateCard(card.id, (c) => ({ ...c, subtasks: [...c.subtasks, { id: uid("sb"), title: t.trim(), assignee: null, due: null, status: "A fazer" }] }));
    log(card.id, `Subtarefa "${t.trim()}" criada`);
    setT("");
  };
  const upd = (id, patch) => {
    if (patch.status) {
      const s0 = card.subtasks.find((x) => x.id === id);
      if (s0 && s0.status !== patch.status) log(card.id, `Subtarefa "${s0.title}" alterada: "${s0.status}" → "${patch.status}"`);
    }
    updateCard(card.id, (c) => ({ ...c, subtasks: c.subtasks.map((s) => (s.id === id ? { ...s, ...patch } : s)) }));
  };
  const remove = (id) => {
    const s0 = card.subtasks.find((x) => x.id === id);
    updateCard(card.id, (c) => ({ ...c, subtasks: c.subtasks.filter((x) => x.id !== id) }));
    log(card.id, `Subtarefa "${s0?.title}" excluída`);
  };
  return (
    <div className="space-y-2">
      {card.subtasks.length === 0 && <Empty icon={ListChecks} title="Sem subtarefas">Quebre o card em tarefas menores com responsável e prazo.</Empty>}
      {card.subtasks.map((s) => (
        <div key={s.id} className="flex flex-wrap items-center gap-2 rounded-xl border border-border bg-card p-2.5">
          <input className={cx(inp(), "min-w-0 flex-1")} value={s.title} disabled={!canEdit} onChange={(e) => upd(s.id, { title: e.target.value })} />
          <select className={cx(inp(), "w-40")} value={s.assignee || ""} disabled={!canEdit} onChange={(e) => upd(s.id, { assignee: e.target.value || null })}>
            <option value="">Sem responsável</option>
            {state.users.map((u) => <option key={u.id} value={u.id}>{u.name}</option>)}
          </select>
          <input type="date" className={cx(inp(), "w-36")} value={s.due || ""} disabled={!canEdit} onChange={(e) => upd(s.id, { due: e.target.value })} />
          <select className={cx(inp(), "w-32")} value={s.status} disabled={!canEdit} onChange={(e) => upd(s.id, { status: e.target.value })}>
            {["A fazer", "Em andamento", "Concluída"].map((o) => <option key={o}>{o}</option>)}
          </select>
          {canEdit && <Btn variant="ghost" size="iconsm" onClick={() => remove(s.id)}><Trash2 size={14} /></Btn>}
        </div>
      ))}
      {canEdit && (
        <div className="flex gap-1.5">
          <input className={inp()} placeholder="Nova subtarefa..." value={t} onChange={(e) => setT(e.target.value)} onKeyDown={(e) => e.key === "Enter" && add()} />
          <Btn variant="primary" onClick={add} icon={Plus}>Adicionar</Btn>
        </div>
      )}
    </div>
  );
}

function Comments({ card }: any) {
  const { state, me, updateCard, log } = useApp();
  const [text, setText] = useState("");
  const [file, setFile] = useState<any>(null);
  const [mention, setMention] = useState(false);
  const send = () => {
    if (!text.trim()) return;
    updateCard(card.id, (c) => ({ ...c, comments: [...c.comments, { id: uid("cm"), userId: me.id, at: Date.now(), text: text.trim(), attachment: file }] }));
    log(card.id, "Comentário adicionado");
    setText(""); setFile(null);
  };
  return (
    <div className="space-y-4">
      <div className="space-y-3">
        {card.comments.length === 0 && <Empty icon={MessageSquare} title="Nenhum comentário ainda">Registre decisões e combinados direto no card.</Empty>}
        {card.comments.map((c) => {
          const u = state.users.find((x) => x.id === c.userId);
          return (
            <div key={c.id} className="flex gap-2.5">
              <Avatar user={u} size={30} />
              <div className="min-w-0 flex-1 rounded-xl border border-border bg-card px-3 py-2.5">
                <div className="flex items-baseline gap-2">
                  <span className="text-sm font-semibold text-foreground">{u ? u.name : "Usuário"}</span>
                  <span className="text-xs text-muted-foreground">{fmtDateTime(c.at)}</span>
                </div>
                <p className="mt-1 whitespace-pre-wrap text-sm text-muted-foreground">
                  {c.text.split(/(@[A-ZÁÉÍÓÚÂÊÔÃÕÇ][\wÀ-ú]+(?: [A-ZÁÉÍÓÚÂÊÔÃÕÇ][\wÀ-ú]+)?)/g).map((part, i) =>
                    part.startsWith("@") ? <span key={i} className="rounded bg-[#04B9CD]/10 px-1 font-medium text-primary">{part}</span> : part
                  )}
                </p>
                {c.attachment && (
                  <div className="mt-2 inline-flex items-center gap-1.5 rounded-lg border border-border bg-muted/40 px-2 py-1 text-xs text-muted-foreground">
                    <Paperclip size={12} />{c.attachment.name}<span className="text-muted-foreground/70">{c.attachment.size}</span>
                  </div>
                )}
              </div>
            </div>
          );
        })}
      </div>
      <div className="rounded-xl border border-border bg-card p-2.5">
        <textarea rows={2} className="w-full resize-none text-sm text-foreground placeholder-muted-foreground outline-none bg-transparent" placeholder="Escreva um comentário..."
          value={text} onChange={(e) => setText(e.target.value)} />
        {file && (
          <div className="mb-2 inline-flex items-center gap-1.5 rounded-lg border border-border bg-muted/40 px-2 py-1 text-xs text-muted-foreground">
            <Paperclip size={12} />{file.name}<button onClick={() => setFile(null)}><X size={12} /></button>
          </div>
        )}
        <div className="relative flex items-center justify-between">
          <div className="flex gap-1">
            <Btn size="sm" variant="ghost" icon={UserIcon} onClick={() => setMention((m) => !m)}>Mencionar</Btn>
            <Btn size="sm" variant="ghost" icon={Paperclip} onClick={() => setFile(MOCK_FILES[Math.floor(Math.random() * MOCK_FILES.length)])}>Anexar</Btn>
            {mention && (
              <div className="absolute bottom-9 left-0 w-56 rounded-xl border border-border bg-card p-1 shadow-lg" style={{ zIndex: 50 }}>
                {state.users.map((u) => (
                  <button key={u.id} className="flex w-full items-center gap-2 rounded-lg px-2 py-1.5 text-left text-sm text-foreground hover:bg-muted/40"
                    onClick={() => { setText((t) => (t ? t + " " : "") + "@" + u.name + " "); setMention(false); }}>
                    <Avatar user={u} size={20} />{u.name}
                  </button>
                ))}
              </div>
            )}
          </div>
          <Btn variant="primary" size="sm" onClick={send} disabled={!text.trim()}>Comentar</Btn>
        </div>
      </div>
    </div>
  );
}

function CardDrawer({ card, onClose }: any) {
  const { state, me, canAdmin, fieldById, boardById, updateCard, log, setCardField, requestMove, highlight, setHighlight, toast, openCard } = useApp();
  const [tab, setTab] = useState("detalhes");
  const [picker, setPicker] = useState(false);
  const [tplPicker, setTplPicker] = useState(false);
  const [showPrev, setShowPrev] = useState(false);
  const [titleDraft, setTitleDraft] = useState(card.title);
  const [descDraft, setDescDraft] = useState(card.description);
  const [originDraft, setOriginDraft] = useState(card.origin || "");
  const board = boardById(card.boardId);
  const stage = board.stages.find((s) => s.id === card.stageId);
  const cardMinistry = MINISTRIES.find((m) => m.id === card.ministryId);
  const cardTeam = cardMinistry?.teams.find((t) => t.id === card.teamId);

  useEffect(() => { setTab("detalhes"); setTitleDraft(card.title); setDescDraft(card.description); setOriginDraft(card.origin || ""); }, [card.id]);
  useEffect(() => {
    const h = (e) => e.key === "Escape" && onClose();
    window.addEventListener("keydown", h);
    return () => window.removeEventListener("keydown", h);
  }, [onClose]);

  const trimTxt = (s) => (s && s.length > 60 ? s.slice(0, 60) + "…" : (s || "vazio"));
  const commitTitle = () => {
    const v = titleDraft.trim();
    if (!v || v === card.title) { setTitleDraft(card.title); return; }
    const oldT = card.title;
    updateCard(card.id, (c) => ({ ...c, title: v }));
    log(card.id, `Título alterado: "${trimTxt(oldT)}" → "${trimTxt(v)}"`);
  };
  const commitDescription = () => {
    if (descDraft === card.description) return;
    const oldD = card.description;
    updateCard(card.id, (c) => ({ ...c, description: descDraft }));
    log(card.id, `Descrição alterada: "${trimTxt(oldD)}" → "${trimTxt(descDraft)}"`);
  };
  const commitOrigin = () => {
    if (originDraft === (card.origin || "")) return;
    const oldO = card.origin || "";
    updateCard(card.id, (c) => ({ ...c, origin: originDraft }));
    log(card.id, `Origem alterada: "${trimTxt(oldO)}" → "${trimTxt(originDraft)}"`);
  };
  const setPriority = (key: string | null) => {
    const oldLabel = PRIORITY_OPTIONS.find((p) => p.key === card.priority)?.label || "Nenhuma";
    const newLabel = PRIORITY_OPTIONS.find((p) => p.key === key)?.label || "Nenhuma";
    updateCard(card.id, (c) => ({ ...c, priority: key }));
    log(card.id, `Prioridade alterada: "${oldLabel}" → "${newLabel}"`);
  };
  const setCardMinistry = (id: number | null) => {
    const oldM = cardMinistry?.name || "Nenhum";
    const newM = MINISTRIES.find((m) => m.id === id)?.name || "Nenhum";
    updateCard(card.id, (c) => ({ ...c, ministryId: id, teamId: null }));
    log(card.id, `Ministério alterado: "${oldM}" → "${newM}"`);
  };
  const setCardTeam = (id: number | null) => {
    const oldT = cardTeam?.name || "Nenhuma";
    const newT = cardMinistry?.teams.find((t) => t.id === id)?.name || "Nenhuma";
    updateCard(card.id, (c) => ({ ...c, teamId: id }));
    log(card.id, `Equipe alterada: "${oldT}" → "${newT}"`);
  };

  const stageEntries = card.fields.filter((e) => e.origin === "stage" && e.stageId === card.stageId);
  const prevEntries = card.fields.filter((e) => e.origin === "stage" && e.stageId !== card.stageId);
  const cardEntries = card.fields.filter((e) => e.origin === "card");
  const pending = stageEntries.filter((e) => e.required && !isFilled(fieldById(e.fieldId), card.values[e.fieldId]));
  const canEdit = true;

  const addCardField = (fieldId) => {
    if (card.fields.some((e) => e.fieldId === fieldId)) { toast("Esse campo já está no card."); return; }
    setCardField(card.id, fieldId);
    toast(`Campo "${fieldById(fieldId).name}" adicionado a este card.`);
  };
  const applyTpl = (tpl) => {
    const add = tpl.fieldIds.filter((fid) => !card.fields.some((e) => e.fieldId === fid));
    updateCard(card.id, (c) => ({ ...c, fields: [...c.fields, ...add.map((fid) => ({ id: uid("ent"), fieldId: fid, required: false, origin: "card", stageId: null }))] }));
    log(card.id, `Template "${tpl.name}" aplicado ao card`);
    toast(`Template "${tpl.name}" aplicado — ${add.length} campos adicionados.`);
  };
  const toggleAssignee = (uid_) => {
    const has = card.assignees.includes(uid_);
    const u = state.users.find((x) => x.id === uid_);
    updateCard(card.id, (c) => ({ ...c, assignees: has ? c.assignees.filter((x) => x !== uid_) : [...c.assignees, uid_] }));
    log(card.id, has ? `Responsável ${u.name} removido` : `Responsável ${u.name} adicionado`);
  };

  const tabs = [
    ["detalhes", "Detalhes", null],
    ["checklists", "Checklists", card.checklists.reduce((a, c) => a + c.items.length, 0)],
    ["subtarefas", "Subtarefas", card.subtasks.length],
    ["comentarios", "Comentários", card.comments.length],
    ["historico", "Histórico", card.history.length],
  ];

  return (
    <div className="fixed inset-0 flex justify-end bg-black bg-opacity-40" style={{ zIndex: 50 }} onMouseDown={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="flex h-full w-full flex-col bg-background shadow-2xl" style={{ maxWidth: 760 }}>
        {/* cabeçalho */}
        <div className="flex items-start gap-3 border-b border-border bg-card px-5 py-3.5">
          <div className="min-w-0 flex-1">
            <div className="flex items-center gap-2 text-xs text-muted-foreground">
              <span>{board.name}</span><ChevronRight size={12} /><span className="text-foreground">{stage.name}</span>
            </div>
            <div className="mt-1 flex items-center gap-2.5">
              <span className="rounded-md bg-muted px-1.5 py-0.5 font-mono text-xs font-semibold text-muted-foreground">{card.code}</span>
              <input className="min-w-0 flex-1 border-b border-transparent bg-transparent text-lg font-semibold text-foreground outline-none hover:border-border focus:border-[#04B9CD]/40"
                value={titleDraft} onChange={(e) => setTitleDraft(e.target.value)} onBlur={commitTitle}
                onKeyDown={(e) => { if (e.key === "Enter") (e.target as HTMLInputElement).blur(); }} />
            </div>
          </div>
          <DropdownMenu items={[
            { label: "Copiar link do card", icon: Copy, onClick: () => toast(`Link do card ${card.code} copiado.`) },
            { sep: true },
            { label: "Excluir card", icon: Trash2, danger: true, onClick: () => { onClose(); updateCard(card.id, null); } },
          ]}>
            <Btn variant="ghost" size="icon"><MoreHorizontal size={16} /></Btn>
          </DropdownMenu>
          <Btn variant="ghost" size="icon" onClick={onClose}><X size={18} /></Btn>
        </div>

        {/* abas */}
        <div className="flex gap-1 border-b border-border bg-card px-4">
          {tabs.map(([id, label, count]) => (
            <button key={id} onClick={() => setTab(id)}
              className={cx("relative px-3 py-2.5 text-sm font-medium transition-colors", tab === id ? "text-primary" : "text-muted-foreground hover:text-foreground")}>
              {label}{count ? <span className="ml-1.5 rounded bg-muted px-1.5 py-0.5 text-xs text-muted-foreground">{count}</span> : null}
              {tab === id && <span className="absolute inset-x-2 -bottom-px h-0.5 rounded-full bg-[#04B9CD]" />}
            </button>
          ))}
        </div>

        <div className="flex min-h-0 flex-1">
          {/* conteúdo */}
          <div className="min-w-0 flex-1 overflow-y-auto p-5">
            {tab === "detalhes" && (
              <div className="space-y-5">
                {pending.length > 0 && (
                  <div className="flex items-start gap-2.5 rounded-xl border border-amber-200 bg-amber-50 px-3.5 py-3">
                    <AlertTriangle size={16} className="mt-0.5 flex-none text-amber-600" />
                    <div>
                      <p className="text-sm font-semibold text-amber-800">{pending.length} campo(s) obrigatório(s) pendente(s) nesta etapa</p>
                      <p className="text-xs text-amber-700">O card não pode avançar enquanto {pending.map((e) => fieldById(e.fieldId).name).join(", ")} não estiver(em) preenchido(s).</p>
                    </div>
                  </div>
                )}

                <div>
                  <SectionTitle>Descrição</SectionTitle>
                  <textarea rows={3} className={inp()} placeholder="Descreva a demanda..." value={descDraft}
                    onChange={(e) => setDescDraft(e.target.value)} onBlur={commitDescription} />
                </div>

                <div>
                  <SectionTitle>Campos da etapa — {stage.name}</SectionTitle>
                  {stageEntries.length === 0 ? (
                    <Empty icon={Layers} title="Esta etapa não tem campos configurados">Configure a etapa na trilha para padronizar as informações.</Empty>
                  ) : (
                    <div className="space-y-2">
                      {stageEntries.map((e) => (
                        <FieldRow key={e.id} card={card} entry={e} canEdit={canEdit} highlight={highlight.includes(e.fieldId)}
                          onRemove={e.required ? null : () => setCardField(card.id, e.fieldId, true)} />
                      ))}
                    </div>
                  )}
                </div>

                {prevEntries.length > 0 && (
                  <div>
                    <button onClick={() => setShowPrev((v) => !v)} className="mb-2 flex items-center gap-1.5 text-xs font-semibold uppercase tracking-wide text-muted-foreground hover:text-foreground">
                      {showPrev ? <ChevronDown size={13} /> : <ChevronRight size={13} />}Campos de etapas anteriores ({prevEntries.length})
                    </button>
                    {showPrev && <div className="space-y-2">{prevEntries.map((e) => <FieldRow key={e.id} card={card} entry={e} canEdit={canEdit} />)}</div>}
                  </div>
                )}

                <div>
                  <SectionTitle right={
                    <div className="flex gap-1.5">
                      <Btn size="sm" icon={LayoutTemplate} onClick={() => setTplPicker(true)}>Aplicar template</Btn>
                      <Btn size="sm" icon={Plus} onClick={() => setPicker(true)}>Adicionar campo</Btn>
                    </div>
                  }>Campos adicionais do card</SectionTitle>
                  {cardEntries.length === 0 ? (
                    <div className="rounded-xl border border-dashed border-border px-4 py-5 text-center">
                      <p className="text-sm text-muted-foreground">Nenhum campo exclusivo neste card.</p>
                      <p className="mt-0.5 text-xs text-muted-foreground/70">Use "Adicionar campo" para registrar algo que só existe aqui, sem alterar a etapa.</p>
                    </div>
                  ) : (
                    <div className="space-y-2">
                      {cardEntries.map((e) => <FieldRow key={e.id} card={card} entry={e} canEdit={canEdit} onRemove={() => setCardField(card.id, e.fieldId, true)} />)}
                    </div>
                  )}
                </div>

                <div>
                  <SectionTitle right={
                    <Btn size="sm" icon={Paperclip} onClick={() => {
                      const f = MOCK_FILES[Math.floor(Math.random() * MOCK_FILES.length)];
                      updateCard(card.id, (c) => ({ ...c, attachments: [...c.attachments, { id: uid("at"), ...f, userId: me.id, at: Date.now() }] }));
                      log(card.id, `Anexo "${f.name}" adicionado`);
                    }}>Adicionar anexo</Btn>
                  }>Anexos</SectionTitle>
                  {card.attachments.length === 0 ? <p className="text-sm text-muted-foreground">Nenhum anexo.</p> : (
                    <div className="space-y-1.5">
                      {card.attachments.map((a) => (
                        <div key={a.id} className="flex items-center gap-2.5 rounded-xl border border-border bg-card px-3 py-2">
                          <Paperclip size={14} className="text-muted-foreground" />
                          <span className="flex-1 text-sm text-foreground">{a.name}</span>
                          <span className="text-xs text-muted-foreground">{a.size} · {fmtDate(iso(a.at))}</span>
                          <Btn variant="ghost" size="iconsm" onClick={() => { updateCard(card.id, (c) => ({ ...c, attachments: c.attachments.filter((x) => x.id !== a.id) })); log(card.id, `Anexo "${a.name}" removido`); }}><X size={14} /></Btn>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </div>
            )}

            {tab === "checklists" && <Checklists card={card} canEdit={canEdit} />}
            {tab === "subtarefas" && <Subtasks card={card} canEdit={canEdit} />}
            {tab === "comentarios" && <Comments card={card} />}
            {tab === "historico" && (
              <div className="space-y-0">
                {card.history.map((h, i) => {
                  const u = state.users.find((x) => x.id === h.userId);
                  return (
                    <div key={h.id} className="flex gap-3">
                      <div className="flex flex-col items-center">
                        <Avatar user={u} size={26} />
                        {i < card.history.length - 1 && <div className="w-px flex-1 bg-border" />}
                      </div>
                      <div className="pb-4">
                        <p className="text-sm text-foreground"><span className="font-semibold text-foreground">{u ? u.name : "Sistema"}</span> — {h.text}</p>
                        <p className="text-xs text-muted-foreground">{fmtDateTime(h.at)}</p>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>

          {/* lateral */}
          <div className="hidden w-60 flex-none overflow-y-auto border-l border-border bg-card p-4 lg:block">
            <div className="space-y-4">
              <div>
                <SectionTitle>Etapa atual</SectionTitle>
                <select className={inp()} value={card.stageId} onChange={(e) => requestMove(card.id, e.target.value)}>
                  {board.stages.map((s) => <option key={s.id} value={s.id}>{s.name}</option>)}
                </select>
                <p className="mt-1 text-xs text-muted-foreground">Mudar a etapa aplica os campos configurados e valida os obrigatórios.</p>
              </div>
              <div>
                <SectionTitle>Responsáveis</SectionTitle>
                <div className="flex flex-wrap gap-1.5">
                  {state.users.map((u) => (
                    <button key={u.id} onClick={() => toggleAssignee(u.id)} title={u.name}
                      className={cx("rounded-full p-0.5 transition-all", card.assignees.includes(u.id) ? "ring-2 ring-[#04B9CD]" : "opacity-40 hover:opacity-80")}>
                      <Avatar user={u} size={28} />
                    </button>
                  ))}
                </div>
              </div>
              <div>
                <SectionTitle>Prazo</SectionTitle>
                <input type="date" className={inp()} value={card.due || ""} onChange={(e) => {
                  const oldDue = card.due ? fmtDate(card.due) : "sem prazo";
                  const newDue = e.target.value ? fmtDate(e.target.value) : "sem prazo";
                  updateCard(card.id, (c) => ({ ...c, due: e.target.value || null }));
                  log(card.id, `Prazo alterado: "${oldDue}" → "${newDue}"`);
                }} />
                {isLate(card.due) && <p className="mt-1 text-xs font-medium text-red-500">Prazo vencido</p>}
              </div>
              <div>
                <SectionTitle>Prioridade</SectionTitle>
                <div className="flex flex-wrap gap-1.5">
                  {PRIORITY_OPTIONS.map((p) => {
                    const active = card.priority === p.key;
                    return (
                      <button key={p.key} onClick={() => setPriority(active ? null : p.key)}
                        className="rounded-md border px-2 py-0.5 text-xs font-medium transition-colors"
                        style={active ? { background: `${p.color}18`, borderColor: `${p.color}60`, color: p.color } : { borderColor: "var(--border)", color: "var(--muted-foreground)" }}>
                        {p.label}
                      </button>
                    );
                  })}
                </div>
              </div>
              <div>
                <SectionTitle>Etiquetas</SectionTitle>
                <div className="flex flex-wrap gap-1.5">
                  {LABELS.map((l) => {
                    const active = card.labels.includes(l.id);
                    return (
                      <button key={l.id} onClick={() => { updateCard(card.id, (c) => ({ ...c, labels: active ? c.labels.filter((x) => x !== l.id) : [...c.labels, l.id] })); log(card.id, `Etiqueta "${l.name}" ${active ? "removida" : "adicionada"}`); }}
                        className={cx("rounded-md border px-2 py-0.5 text-xs font-medium transition-opacity", TONE[l.tone], active ? "opacity-100" : "opacity-40 hover:opacity-70")}>
                        {l.name}
                      </button>
                    );
                  })}
                </div>
              </div>
              <div>
                <SectionTitle>Relacionamentos</SectionTitle>
                <p className="mb-2 text-xs text-muted-foreground">De onde essa tarefa surgiu — opcional.</p>
                <div className="space-y-2.5">
                  <div>
                    <label className="mb-1 block text-xs text-muted-foreground">Ministério</label>
                    <select className={inp()} value={card.ministryId ?? ""} onChange={(e) => setCardMinistry(e.target.value ? Number(e.target.value) : null)}>
                      <option value="">Nenhum</option>
                      {MINISTRIES.map((m) => <option key={m.id} value={m.id}>{m.emoji} {m.name}</option>)}
                    </select>
                  </div>
                  {cardMinistry && (
                    <div>
                      <label className="mb-1 block text-xs text-muted-foreground">Equipe</label>
                      <select className={inp()} value={card.teamId ?? ""} onChange={(e) => setCardTeam(e.target.value ? Number(e.target.value) : null)}>
                        <option value="">Nenhuma</option>
                        {cardMinistry.teams.map((t) => <option key={t.id} value={t.id}>{t.name}</option>)}
                      </select>
                    </div>
                  )}
                  <div>
                    <label className="mb-1 block text-xs text-muted-foreground">Origem</label>
                    <input className={inp()} placeholder="Ex.: Evento Conferência de Jovens" value={originDraft}
                      onChange={(e) => setOriginDraft(e.target.value)} onBlur={commitOrigin}
                      onKeyDown={(e) => { if (e.key === "Enter") (e.target as HTMLInputElement).blur(); }} />
                  </div>
                </div>
              </div>
              <div className="rounded-xl bg-muted/30 p-3 text-xs text-muted-foreground">
                <p>Criado por {(state.users.find((u) => u.id === card.createdBy) || {}).name}</p>
                <p className="mt-0.5">{fmtDateTime(card.createdAt)}</p>
              </div>
            </div>
          </div>
        </div>
      </div>
      <FieldPicker open={picker} onClose={() => setPicker(false)} onPick={addCardField} excludeIds={card.fields.map((e) => e.fieldId)} />
      <TemplatePicker open={tplPicker} onClose={() => setTplPicker(false)} onPick={applyTpl} title="Aplicar template ao card" />
    </div>
  );
}

function CardTile({ card, board, onOpen, onDragStart, onDragEnd, onDropOn }: any) {
  const { state, fieldById } = useApp();
  const d = board.display;
  const done = card.checklists.reduce((a, c) => a + c.items.filter((i) => i.done).length, 0);
  const total = card.checklists.reduce((a, c) => a + c.items.length, 0);
  const shownFields = (d.fields || []).map((fid) => {
    const entry = card.fields.find((e) => e.fieldId === fid);
    return { f: fieldById(fid), v: card.values[fid], label: entry?.label };
  }).filter((x) => x.f && isFilled(x.f, x.v));
  const pending = card.fields.filter((e) => e.origin === "stage" && e.stageId === card.stageId && e.required && !isFilled(fieldById(e.fieldId), card.values[e.fieldId])).length;

  return (
    <div draggable onDragStart={onDragStart} onDragEnd={onDragEnd} onClick={() => onOpen(card.id)}
      onDragOver={(e) => e.preventDefault()}
      onDrop={(e) => { e.preventDefault(); e.stopPropagation(); onDropOn && onDropOn(card.id); }}
      className="group cursor-pointer rounded-xl border border-border bg-card p-3 shadow-sm transition-all hover:border-[#04B9CD]/30 hover:shadow-md">
      <div className="flex items-center gap-2">
        {d.code && <span className="font-mono text-xs font-semibold text-muted-foreground">{card.code}</span>}
        {card.priority && (() => {
          const p = PRIORITY_OPTIONS.find((x) => x.key === card.priority);
          return p ? <span className="flex items-center gap-1 text-xs font-medium" style={{ color: p.color }}><span className="h-1.5 w-1.5 rounded-full" style={{ background: p.color }} />{p.label}</span> : null;
        })()}
        {pending > 0 && (
          <span className="ml-auto flex items-center gap-1 rounded-md border border-amber-200 bg-amber-50 px-1.5 py-0.5 text-xs font-medium text-amber-700" title="Campos obrigatórios pendentes">
            <AlertTriangle size={11} />{pending}
          </span>
        )}
      </div>
      <p className="mt-1 text-sm font-medium leading-snug text-foreground">{card.title}</p>

      {d.labels && card.labels.length > 0 && (
        <div className="mt-2 flex flex-wrap gap-1">
          {card.labels.map((id) => { const l = LABELS.find((x) => x.id === id); return l ? <Chip key={id} tone={l.tone}>{l.name}</Chip> : null; })}
        </div>
      )}

      {shownFields.length > 0 && (
        <div className="mt-2 space-y-0.5">
          {shownFields.map(({ f, v, label }) => (
            <p key={f.id} className="truncate text-xs text-muted-foreground"><span className="text-muted-foreground/70">{label || f.name}:</span> {displayValue(f, v, state.users)}</p>
          ))}
        </div>
      )}

      <div className="mt-2.5 flex items-center gap-3 text-xs text-muted-foreground">
        {d.due && card.due && (
          <span className={cx("flex items-center gap-1 rounded px-1 py-0.5", isLate(card.due) ? "bg-red-500/10 font-medium text-red-500" : card.due === today() ? "bg-amber-50 font-medium text-amber-700" : "")}>
            <Clock size={12} />{fmtRelDate(card.due)}
          </span>
        )}
        {d.checklist && total > 0 && <span className="flex items-center gap-1"><ListChecks size={12} />{done}/{total}</span>}
        {d.comments && card.comments.length > 0 && <span className="flex items-center gap-1"><MessageSquare size={12} />{card.comments.length}</span>}
        {d.attachments && card.attachments.length > 0 && <span className="flex items-center gap-1"><Paperclip size={12} />{card.attachments.length}</span>}
        {d.assignees && (
          <span className="ml-auto flex -space-x-1.5">
            {card.assignees.map((id) => <Avatar key={id} user={state.users.find((u) => u.id === id)} size={22} />)}
          </span>
        )}
      </div>
    </div>
  );
}

function Column({ board, stage, index, cards, onOpen, onConfig, drag, setDrag, onDropCard, onMoveStage, onReorderCard, quickAddOpen, onOpenQuickAdd, onCloseQuickAdd }: any) {
  const { canAdmin, setState, toast, createCard } = useApp();
  const [over, setOver] = useState(false);
  const [popoverOpen, setPopoverOpen] = useState(false);
  const [quickTitle, setQuickTitle] = useState("");
  const quickRef = useRef(null);
  const req = stage.fields.filter((f) => f.required).length;
  const opt = stage.fields.length - req;
  const total = board.stages.length;
  const category = stageCategoryFor(stage, index, total);
  const colorDef = stageColorFor(stage, index, total);

  useEffect(() => { if (quickAddOpen) requestAnimationFrame(() => quickRef.current?.focus()); }, [quickAddOpen]);

  const submitQuick = (e?: any) => {
    if (e) e.preventDefault();
    const t = quickTitle.trim();
    if (t) createCard({ boardId: board.id, stageId: stage.id, title: t, silent: true });
    setQuickTitle("");
    requestAnimationFrame(() => quickRef.current?.focus());
  };
  const closeQuick = () => { setQuickTitle(""); onCloseQuickAdd(); };

  const rename = (newName: string) => {
    setState((s) => ({ ...s, boards: s.boards.map((b) => (b.id !== board.id ? b : { ...b, stages: b.stages.map((st) => (st.id === stage.id ? { ...st, name: newName || st.name } : st)) })) }));
  };
  const setCategory = (key: string) => {
    setState((s) => ({ ...s, boards: s.boards.map((b) => (b.id !== board.id ? b : { ...b, stages: b.stages.map((st) => (st.id === stage.id ? { ...st, category: key } : st)) })) }));
  };
  const setColor = (key: string) => {
    setState((s) => ({ ...s, boards: s.boards.map((b) => (b.id !== board.id ? b : { ...b, stages: b.stages.map((st) => (st.id === stage.id ? { ...st, color: key } : st)) })) }));
  };
  const removeStage = () => {
    setState((s) => ({
      ...s,
      boards: s.boards.map((b) => (b.id !== board.id ? b : { ...b, stages: b.stages.filter((st) => st.id !== stage.id) })),
      cards: s.cards.filter((c) => c.stageId !== stage.id),
    }));
    toast(`Etapa "${stage.name}" excluída.`);
  };

  return (
    <div className={cx("flex h-full w-[86vw] flex-none flex-col rounded-xl border p-2 transition-colors snap-start", colorDef.bgLight, colorDef.borderLight, over ? "ring-2 ring-[#04B9CD]/40" : "")}
      onDragOver={(e) => { if (drag) { e.preventDefault(); if (drag.type === "card") setOver(true); } }}
      onDragLeave={() => setOver(false)}
      onDrop={(e) => {
        e.preventDefault(); setOver(false);
        if (drag && drag.type === "card") onDropCard(drag.id, stage.id);
        if (drag && drag.type === "stage" && drag.id !== stage.id) onMoveStage(drag.id, index);
        setDrag(null);
      }}>
      <div
        draggable={canAdmin && !popoverOpen}
        onDragStart={() => setDrag({ type: "stage", id: stage.id })}
        onDragEnd={() => setDrag(null)}
        className="relative mb-2 flex items-center gap-1.5 px-0.5 py-1">
        {canAdmin && <GripVertical size={14} className="cursor-grab text-muted-foreground/40 flex-shrink-0" />}
        <button onClick={() => canAdmin && setPopoverOpen((v) => !v)} disabled={!canAdmin}
          className="flex min-w-0 flex-1 items-center gap-1.5 rounded-full py-1 pl-2 pr-2.5 transition-transform hover:scale-[1.02]" style={{ background: colorDef.solid }}>
          <StatusIcon category={category} size={12} className="text-white flex-shrink-0" />
          <span className="min-w-0 flex-1 truncate text-left text-xs font-bold uppercase tracking-wide text-white">{stage.name}</span>
        </button>
        <span className="flex-shrink-0 text-xs font-medium text-muted-foreground">{cards.length}</span>
        <Btn variant="ghost" size="iconsm" onClick={onOpenQuickAdd} title="Adicionar card"><Plus size={15} /></Btn>
        <DropdownMenu items={[
          canAdmin && { label: "Configurar etapa", icon: Settings, onClick: () => onConfig(stage) },
          canAdmin && { label: "Renomear e definir cor", icon: Pencil, onClick: () => setPopoverOpen(true) },
          { label: "Adicionar card", icon: Plus, onClick: onOpenQuickAdd },
          canAdmin && { sep: true },
          canAdmin && { label: "Mover para esquerda", icon: ChevronLeft, onClick: () => onMoveStage(stage.id, Math.max(0, index - 1)) },
          canAdmin && { label: "Mover para direita", icon: ChevronRight, onClick: () => onMoveStage(stage.id, index + 1) },
          canAdmin && { sep: true },
          canAdmin && { label: "Excluir etapa", icon: Trash2, danger: true, onClick: removeStage },
        ].filter(Boolean)}>
          <Btn variant="ghost" size="iconsm"><MoreHorizontal size={15} /></Btn>
        </DropdownMenu>
        {popoverOpen && (
          <StagePopover
            stage={stage} category={category} colorKey={colorDef.key}
            onRename={rename} onPickCategory={setCategory} onPickColor={setColor}
            onConfig={() => onConfig(stage)}
            onClose={() => setPopoverOpen(false)}
          />
        )}
      </div>

      {(req > 0 || opt > 0) && (
        <button onClick={() => canAdmin && onConfig(stage)} disabled={!canAdmin}
          className={cx("mb-2 flex items-center gap-2 rounded-lg px-2 py-1 text-xs", canAdmin ? "text-muted-foreground hover:bg-card/60 hover:text-foreground" : "text-muted-foreground/60")}>
          <Layers size={12} />{req} obrigatório(s) · {opt} opcional(is)
        </button>
      )}

      <div className="min-h-0 flex-1 space-y-2 overflow-y-auto rounded-lg p-1">
        {cards.map((c) => (
          <CardTile key={c.id} card={c} board={board} onOpen={onOpen}
            onDragStart={() => setDrag({ type: "card", id: c.id })} onDragEnd={() => setDrag(null)}
            onDropOn={(targetId) => { if (drag && drag.type === "card" && drag.id !== targetId) onReorderCard(drag.id, targetId); setDrag(null); }} />
        ))}
        {cards.length === 0 && !quickAddOpen && <div className="rounded-xl border border-dashed border-border py-6 text-center text-xs text-muted-foreground">Solte um card aqui</div>}

        {quickAddOpen ? (
          <form onSubmit={submitQuick} className="rounded-xl border border-[#04B9CD]/40 bg-card p-2 shadow-sm">
            <textarea ref={quickRef} rows={2} value={quickTitle} onChange={(e) => setQuickTitle(e.target.value)}
              onKeyDown={(e) => { if (e.key === "Enter" && !e.shiftKey) submitQuick(e); if (e.key === "Escape") closeQuick(); }}
              placeholder="Título do card…" className="w-full resize-none border-0 bg-transparent text-sm text-foreground placeholder-muted-foreground outline-none" />
            <div className="mt-1.5 flex items-center gap-2">
              <Btn type="submit" variant="primary" size="sm" disabled={!quickTitle.trim()}>Adicionar card</Btn>
              <button type="button" onClick={closeQuick} className="text-muted-foreground hover:text-foreground"><X size={16} /></button>
            </div>
          </form>
        ) : (
          <button onClick={onOpenQuickAdd} style={{ color: colorDef.solid }}
            className="flex w-full items-center gap-1.5 rounded-lg px-2 py-1.5 text-xs font-semibold hover:bg-card/60">
            <Plus size={13} />Adicionar card
          </button>
        )}
      </div>
    </div>
  );
}
